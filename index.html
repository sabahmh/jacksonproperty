<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Maxxan Realty</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-2 sm:p-4">

    <!-- Skrin Loading Awal -->
    <div id="loadingScreen" class="fixed inset-0 bg-slate-900 flex flex-col items-center justify-center z-50 text-slate-400">
        <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-blue-500"></i>
        <p class="text-sm">Menyemak sesi...</p>
    </div>

    <!-- BAHAGIAN 1: BORANG LOG MASUK (Dipaparkan jika belum log masuk) -->
    <div id="loginSection" style="display: none;" class="bg-slate-800 p-6 sm:p-8 rounded-2xl border border-slate-700 shadow-xl w-full max-w-md">
        <div class="flex justify-center mb-6">
            <div class="w-16 h-16 bg-white p-2 rounded-xl flex items-center justify-center shadow">
                <img src="https://maxxan.erp213.com/img/logo-maxxan.png" alt="Logo Maxxan" class="w-full h-full object-contain">
            </div>
        </div>
        <h2 class="text-xl font-bold text-center text-white mb-1">Log Masuk Admin</h2>
        <p class="text-xs text-slate-400 text-center mb-6">Maxxan Realty Sandakan</p>
        
        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">E-mel</label>
                <input type="email" id="loginEmail" required class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500" placeholder="nama@contoh.com">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Kata Laluan</label>
                <input type="password" id="loginPassword" required class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg text-sm transition-colors shadow">Log Masuk</button>
            <div id="loginError" class="text-red-400 text-xs text-center bg-red-500/10 p-2 rounded border border-red-500/20 hidden"></div>
        </form>
    </div>

    <!-- BAHAGIAN 2: PORTAL UTAMA (Dipaparkan jika sudah log masuk) -->
    <div id="portalSection" style="display: none;" class="w-full max-w-3xl flex flex-col justify-between min-h-[92vh]">
        <header class="text-center my-2 sm:my-4 flex flex-col items-center relative">
            <button onclick="handleLogout()" class="absolute right-0 top-0 text-xs bg-slate-800 hover:bg-red-600 text-slate-300 hover:text-white px-2.5 py-1 rounded-lg border border-slate-700 transition-colors flex items-center gap-1.5 shadow-sm">
                <i class="fa-solid fa-right-from-bracket"></i> Keluar
            </button>
            <div class="w-14 h-14 sm:w-16 sm:h-16 mb-2 rounded-xl bg-white p-2 shadow-lg flex items-center justify-center overflow-hidden border border-slate-700">
                <img src="https://maxxan.erp213.com/img/logo-maxxan.png" alt="Logo Maxxan" class="w-full h-full object-contain">
            </div>
            <h1 class="text-lg sm:text-xl font-bold tracking-tight text-white">SABAH MH</h1>
            <p class="text-xs sm:text-sm font-medium text-emerald-400 mt-0.5">Jackson Property</p>
            <p class="text-[11px] sm:text-xs text-slate-400 mt-0.5">Perunding Hartanah Maxxan Realty • Sila pilih perkhidmatan</p>
        </header>

        <main class="my-auto py-1">
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5 sm:gap-3">
                <a href="listing.html" target="_blank" class="flex flex-col items-center justify-center p-3 bg-slate-800 hover:bg-blue-600 rounded-xl border border-slate-700 hover:border-blue-500 transition-all duration-200 group text-center shadow-sm">
                    <div class="w-10 h-10 rounded-full bg-blue-500/20 group-hover:bg-white/20 flex items-center justify-center text-blue-400 group-hover:text-white mb-1.5 transition-colors">
                        <i class="fa-solid fa-mountain-sun text-base sm:text-lg"></i>
                    </div>
                    <span class="text-[11px] sm:text-xs font-semibold text-slate-200 group-hover:text-white">SABAH MH LISTING</span>
                </a>
                <a href="https://jacksonproperty.netlify.app/" target="_blank" class="flex flex-col items-center justify-center p-3 bg-slate-800 hover:bg-emerald-600 rounded-xl border border-slate-700 hover:border-emerald-500 transition-all duration-200 group text-center shadow-sm">
                    <div class="w-10 h-10 rounded-full bg-emerald-500/20 group-hover:bg-white/20 flex items-center justify-center text-emerald-400 group-hover:text-white mb-1.5 transition-colors">
                        <i class="fa-solid fa-house-chimney text-base sm:text-lg"></i>
                    </div>
                    <span class="text-[11px] sm:text-xs font-semibold text-slate-200 group-hover:text-white">Jackson Property</span>
                </a>
                <a href="https://maxxan.erp213.com/login.html" target="_blank" class="flex flex-col items-center justify-center p-3 bg-slate-800 hover:bg-amber-600 rounded-xl border border-slate-700 hover:border-amber-500 transition-all duration-200 group text-center shadow-sm">
                    <div class="w-10 h-10 rounded-full bg-amber-500/20 group-hover:bg-white/20 flex items-center justify-center text-amber-400 group-hover:text-white mb-1.5 transition-colors">
                        <i class="fa-solid fa-right-to-bracket text-base sm:text-lg"></i>
                    </div>
                    <span class="text-[11px] sm:text-xs font-semibold text-slate-200 group-hover:text-white">MOS</span>
                </a>
                <a href="https://jacksonsewa.netlify.app/" target="_blank" class="flex flex-col items-center justify-center p-3 bg-slate-800 hover:bg-purple-600 rounded-xl border border-slate-700 hover:border-purple-500 transition-all duration-200 group text-center shadow-sm">
                    <div class="w-10 h-10 rounded-full bg-purple-500/20 group-hover:bg-white/20 flex items-center justify-center text-purple-400 group-hover:text-white mb-1.5 transition-colors">
                        <i class="fa-solid fa-calculator text-base sm:text-lg"></i>
                    </div>
                    <span class="text-[11px] sm:text-xs font-semibold text-slate-200 group-hover:text-white">Kira Sewa</span>
                </a>
                <a href="jacksonloan.html" target="_blank" class="flex flex-col items-center justify-center p-3 bg-slate-800 hover:bg-rose-600 rounded-xl border border-slate-700 hover:border-rose-500 transition-all duration-200 group text-center shadow-sm">
                    <div class="w-10 h-10 rounded-full bg-rose-500/20 group-hover:bg-white/20 flex items-center justify-center text-rose-400 group-hover:text-white mb-1.5 transition-colors">
                        <i class="fa-solid fa-percent text-base sm:text-lg"></i>
                    </div>
                    <span class="text-[11px] sm:text-xs font-semibold text-slate-200 group-hover:text-white">Kelayakan Loan</span>
                </a>
                <a href="sungaikayu.html" target="_blank" class="flex flex-col items-center justify-center p-3 bg-slate-800 hover:bg-teal-600 rounded-xl border border-slate-700 hover:border-teal-500 transition-all duration-200 group text-center shadow-sm">
                    <div class="w-10 h-10 rounded-full bg-teal-500/20 group-hover:bg-white/20 flex items-center justify-center text-teal-400 group-hover:text-white mb-1.5 transition-colors">
                        <i class="fa-solid fa-building-user text-base sm:text-lg"></i>
                    </div>
                    <span class="text-[11px] sm:text-xs font-semibold text-slate-200 group-hover:text-white">Sungai Kayu</span>
                </a>
                <a href="villalestari.html" target="_blank" class="flex flex-col items-center justify-center p-3 bg-slate-800 hover:bg-indigo-600 rounded-xl border border-slate-700 hover:border-indigo-500 transition-all duration-200 group text-center shadow-sm">
                    <div class="w-10 h-10 rounded-full bg-indigo-500/20 group-hover:bg-white/20 flex items-center justify-center text-indigo-400 group-hover:text-white mb-1.5 transition-colors">
                        <i class="fa-solid fa-hotel text-base sm:text-lg"></i>
                    </div>
                    <span class="text-[11px] sm:text-xs font-semibold text-slate-200 group-hover:text-white">Villa Lestari</span>
                </a>
                <a href="https://ekosaujana.netlify.app/" target="_blank" class="flex flex-col items-center justify-center p-3 bg-slate-800 hover:bg-cyan-600 rounded-xl border border-slate-700 hover:border-cyan-500 transition-all duration-200 group text-center shadow-sm">
                    <div class="w-10 h-10 rounded-full bg-cyan-500/20 group-hover:bg-white/20 flex items-center justify-center text-cyan-400 group-hover:text-white mb-1.5 transition-colors">
                        <i class="fa-solid fa-seedling text-base sm:text-lg"></i>
                    </div>
                    <span class="text-[11px] sm:text-xs font-semibold text-slate-200 group-hover:text-white">Eko Saujana</span>
                </a>
            </div>
        </main>

        <footer class="text-center text-[11px] text-slate-500 my-2">
            <p>&copy; 2026 Jackson Richard • Maxxan Realty Sandakan</p>
        </footer>
    </div>

    <!-- Skrip Pengurusan Firebase Tunggal -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCIB8qLZWjGVitHnJzS58BHPYoYdD_i7uM",
            authDomain: "listing-2a59c.firebaseapp.com",
            projectId: "listing-2a59c",
            storageBucket: "listing-2a59c.firebasestorage.app",
            messagingSenderId: "363739620416",
            appId: "1:363739620416:web:b14bd9043ac09a8032eba5",
            measurementId: "G-SZ47HNR9PT"
        };
        firebase.initializeApp(firebaseConfig);

        // Pantau status auth secara langsung dalam satu domain
        firebase.auth().onAuthStateChanged((user) => {
            document.getElementById('loadingScreen').style.display = 'none';
            if (user) {
                // Pengguna sudah log masuk -> Papar portal utama
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('portalSection').style.display = 'flex';
            } else {
                // Pengguna belum log masuk -> Papar borang login
                document.getElementById('portalSection').style.display = 'none';
                document.getElementById('loginSection').style.display = 'block';
            }
        });

        // Fungsi Log Masuk
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorBox = document.getElementById('loginError');

            firebase.auth().signInWithEmailAndPassword(email, password)
                .catch((error) => {
                    errorBox.innerText = "Log masuk gagal. E-mel atau kata laluan salah.";
                    errorBox.classList.remove('hidden');
                });
        }

        // Fungsi Log Keluar
        function handleLogout() {
            firebase.auth().signOut();
        }
    </script>
</body>
</html>
