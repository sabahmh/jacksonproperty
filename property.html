<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=loops&utm_source=ai-legible&utm_medium=owned&utm_content=comment&utm_id=bcea4e00-7e0c-47fe-908f-1a1cb8191c35
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jackson Property | Cari Rumah Impian Anda</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f5f5f5; color: #222; }

    header { background: #111; color: #fff; padding: 14px 16px; position: sticky; top: 0; z-index: 100; }
    .header-content { max-width: 1000px; margin: auto; display: flex; justify-content: space-between; align-items: center; gap: 15px; }
    .brand-wrapper { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .property-logo { width: 50px; height: 50px; object-fit: contain; border-radius: 8px; background: #fff; flex-shrink: 0; }
    .brand h1 { margin: 0; font-size: 21px; white-space: nowrap; }
    .brand p { margin: 4px 0 0; font-size: 13px; color: #ccc; }

    button, .button { border: none; border-radius: 10px; padding: 12px 15px; font-size: 14px; font-weight: bold; cursor: pointer; }
    .admin-photo { width: 32px; height: 32px; object-fit: cover; border-radius: 50%; cursor: pointer; flex-shrink: 0; border: 1.5px solid #fff; }

    .container { max-width: 1000px; margin: auto; padding: 20px 16px; }

    .zone-buttons { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; }
    .zone-button { background: #fff; color: #222; border: 1px solid #ddd; white-space: nowrap; }
    .zone-button.active { background: #111; color: #fff; }

    .section-title { margin: 15px 0; font-size: 20px; }

    .property-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    .property-card { background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 3px 12px rgba(0,0,0,0.08); }
    .property-image { width: 100%; height: 220px; object-fit: cover; display: block; background: #ddd; }
    .property-content { padding: 16px; }
    .property-name { margin: 8px 0; font-size: 19px; }
    .price { font-size: 23px; font-weight: bold; margin: 8px 0; }
    .location { color: #666; margin: 8px 0; }
    .description { line-height: 1.5; color: #444; font-size: 14px; white-space: pre-line; }

    .status { display: inline-block; padding: 6px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-top: 8px; }
    .available { background: #e7f7eb; color: #187a37; }
    .booked { background: #fff4d6; color: #996300; }
    .sold { background: #ffe3e3; color: #b02020; }

    .property-actions { display: flex; gap: 8px; margin-top: 16px; }
    .whatsapp { background: #25D366; color: #fff; flex: 1; text-align: center; text-decoration: none; }

    #adminPage { display: none; }
    .panel { background: #fff; border-radius: 14px; padding: 20px; max-width: 650px; margin: auto; box-shadow: 0 3px 12px rgba(0,0,0,0.08); }
    .login-panel { max-width: 380px; margin-top: 40px; }

    label { display: block; font-size: 14px; font-weight: bold; margin-top: 12px; }
    input, textarea, select { width: 100%; margin-top: 6px; padding: 13px; border: 1px solid #ddd; border-radius: 9px; font-size: 15px; }
    textarea { resize: vertical; }

    /* Paksa paparan input nama jadi huruf besar */
    #propertyName { text-transform: uppercase; }

    .publish-button { width: 100%; margin-top: 20px; background: #111; color: #fff; }
    .edit-button { width: 100%; background: #111; color: #fff; margin-top: 10px; }
    .delete-button { width: 100%; background: #ffe5e5; color: #b02020; margin-top: 8px; }
    .cancel-button { width: 100%; margin-top: 10px; background: #eee; color: #222; }

    .top-admin-actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 15px; }
    .hidden { display: none !important; }
    .empty { text-align: center; padding: 50px 20px; color: #777; grid-column: 1 / -1; }
    .manage-title { margin-top: 30px; }
    #imageStatus { font-size: 13px; color: #666; margin-top: 4px; display: block; }
  </style>
</head>

<body>

<!-- HEADER -->
<header>
  <div class="header-content">
    <div class="brand-wrapper">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR9sKS7o8ocx7jnNJ5DA-_CZv1c356r_iMwID9sfySZKw&s=10" alt="Jackson Property Logo" class="property-logo">
      <div class="brand">
        <h1>JACKSON PROPERTY</h1>
        <p>Cari Rumah Impian Anda 🏠</p>
      </div>
    </div>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ0WMTAjKCx3_U3vBwRFfCmQKIE-6eJd8BqxUR2aBWdcg&s=10" alt="Admin" class="admin-photo" onclick="openAdmin()">
  </div>
</header>

<!-- PUBLIC PAGE -->
<main id="publicPage">
  <div class="container">
    <div class="zone-buttons">
      <button class="zone-button active" onclick="changeZone('Sandakan', this)">Sandakan</button>
      <button class="zone-button" onclick="changeZone('Kota Kinabalu', this)">Kota Kinabalu</button>
      <button class="zone-button" onclick="changeZone('Tawau', this)">Tawau</button>
    </div>

    <h2 class="section-title" id="zoneTitle">Property di Sandakan</h2>
    <div class="property-grid" id="propertyList"></div>
  </div>
</main>

<!-- ADMIN PAGE -->
<main id="adminPage">
  <!-- LOGIN -->
  <div id="loginBox" class="panel login-panel">
    <h2>🔐 Admin Login</h2>
    
    <label>Email Admin</label>
    <input type="email" id="adminEmail" placeholder="Masukkan e-mel anda" autocomplete="email">

    <label>Password</label>
    <input type="password" id="password" placeholder="Masukkan password" autocomplete="current-password" onkeydown="if(event.key === 'Enter') login()">
    
    <button class="publish-button" onclick="login()">LOGIN</button>
  </div>

  <!-- ADMIN DASHBOARD -->
  <div id="adminDashboard" class="container hidden">
    <div class="panel">
      <div class="top-admin-actions">
        <h2 id="formTitle">➕ Tambah Property</h2>
        <button onclick="backToWebsite()">Website</button>
      </div>

      <label>Zone</label>
      <select id="propertyZone">
        <option value="Sandakan" selected>Sandakan</option>
        <option value="Kota Kinabalu">Kota Kinabalu</option>
        <option value="Tawau">Tawau</option>
      </select>

      <label>Gambar Property</label>
      <input type="file" id="propertyImageFile" accept="image/*">
      <span id="imageStatus"></span>

      <label>Nama Property</label>
      <input type="text" id="propertyName" placeholder="Contoh: TAMAN MAWAR FASA 7" oninput="this.value = this.value.toUpperCase()">

      <label>Harga</label>
      <input type="text" id="propertyPrice" inputmode="numeric" placeholder="Contoh: 190000">

      <label>Lokasi</label>
      <input type="text" id="propertyLocation" placeholder="Contoh: Bandar Indah, Sandakan">

      <label>Description Pendek</label>
      <textarea id="propertyDescription" rows="4" placeholder="Masukkan description pendek"></textarea>

      <label>Status</label>
      <select id="propertyStatus">
        <option value="Available">Available</option>
        <option value="Booked">Booked</option>
        <option value="Sold">Sold</option>
      </select>

      <button class="publish-button" onclick="saveProperty()">🚀 PUBLISH PROPERTY</button>
      <button id="cancelEditButton" class="cancel-button hidden" onclick="cancelEdit()">Cancel Edit</button>
    </div>

    <h2 class="manage-title">Manage Listing</h2>
    <div class="property-grid" id="manageList"></div>
  </div>
</main>

<script>
/* =========================================
   SETTINGS & FIREBASE CONFIG
========================================= */
const WHATSAPP_NUMBER = "60138885020";
const IMGBB_API_KEY = "6c2f224bc6526cb2c326211aa6439e76";

const firebaseConfig = {
  apiKey: "AIzaSyCIB8qLZWjGVitHnJzS58BHPYoYdD_i7uM",
  authDomain: "listing-2a59c.firebaseapp.com",
  projectId: "listing-2a59c",
  storageBucket: "listing-2a59c.firebasestorage.app",
  messagingSenderId: "363739620416",
  appId: "1:363739620416:web:b14bd9043ac09a8032eba5",
  measurementId: "G-SZ47HNR9PT"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let selectedZone = "Sandakan";
let editingId = null;
let currentImageUrl = "https://placehold.co/800x500?text=Property+Photo";
let properties = [];

/* =========================================
   FIREBASE AUTHENTICATION LOGIN
========================================= */
async function login() {
  const email = document.getElementById("adminEmail").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    alert("Sila masukkan e-mel dan password.");
    return;
  }

  firebase.auth().signInWithEmailAndPassword(email, password)
    .then((userCredential) => {
      document.getElementById("adminEmail").value = "";
      document.getElementById("password").value = "";
      document.getElementById("loginBox").classList.add("hidden");
      document.getElementById("adminDashboard").classList.remove("hidden");
      loadPropertiesFromFirebase();
    })
    .catch((error) => {
      alert("Log masuk gagal. E-mel atau password salah.");
      console.error(error.message);
    });
}

/* =========================================
   FIREBASE REAL-TIME SYNC
========================================= */
function loadPropertiesFromFirebase() {
  db.collection("properties").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
    properties = [];
    snapshot.forEach((doc) => {
      properties.push({ id: doc.id, ...doc.data() });
    });
    renderPublicListings();
    renderManageListings();
  });
}

function loadPublicProperties() {
  db.collection("properties").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
    properties = [];
    snapshot.forEach((doc) => {
      properties.push({ id: doc.id, ...doc.data() });
    });
    renderPublicListings();
  });
}

/* =========================================
   HELPERS & FORMATTING
========================================= */
function formatPrice(price) {
  const number = String(price).replace(/[^0-9]/g, "");
  if (!number) return "RM0";
  return "RM" + Number(number).toLocaleString("en-MY");
}

function changeZone(zone, button) {
  selectedZone = zone;
  document.querySelectorAll(".zone-button").forEach(item => item.classList.remove("active"));
  button.classList.add("active");
  document.getElementById("zoneTitle").innerText = "Property di " + zone;
  renderPublicListings();
}

function getStatusClass(status) {
  if (status === "Available") return "available";
  if (status === "Booked") return "booked";
  return "sold";
}

function escapeHTML(text) {
  return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

/* =========================================
   PUBLIC LISTINGS
========================================= */
function renderPublicListings() {
  const list = document.getElementById("propertyList");
  const filtered = properties.filter(p => p.zone === selectedZone);

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty">Belum ada property di ${escapeHTML(selectedZone)}.</div>`;
    return;
  }

  list.innerHTML = filtered.map(property => {
    const message = encodeURIComponent(`Hi Jackson, saya berminat dengan property ${property.name}. Boleh bagi maklumat lanjut?`);
    return `
    <div class="property-card">
      <img class="property-image" src="${escapeHTML(property.image)}" alt="${escapeHTML(property.name)}" loading="lazy">
      <div class="property-content">
        <span class="status ${getStatusClass(property.status)}">${escapeHTML(property.status)}</span>
        <h3 class="property-name">${escapeHTML(property.name)}</h3>
        <div class="price">${formatPrice(property.price)}</div>
        <div class="location">📍 ${escapeHTML(property.location)}</div>
        <p class="description">${escapeHTML(property.description)}</p>
        <div class="property-actions">
          <a class="button whatsapp" href="https://wa.me/${WHATSAPP_NUMBER}?text=${message}" target="_blank">💬 WHATSAPP JACKSON</a>
        </div>
      </div>
    </div>`;
  }).join("");
}

/* =========================================
   NAVIGATION ADMIN
========================================= */
function openAdmin() {
  document.getElementById("publicPage").style.display = "none";
  document.getElementById("adminPage").style.display = "block";
  window.scrollTo(0, 0);
}

function backToWebsite() {
  document.getElementById("adminPage").style.display = "none";
  document.getElementById("publicPage").style.display = "block";
  renderPublicListings();
  window.scrollTo(0, 0);
}

/* =========================================
   FUNGSI TUKAR FILE KEPADA BASE64 UNTUK API
========================================= */
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = error => reject(error);
  });
}

document.getElementById("propertyImageFile").addEventListener("change", function(event) {
  if (event.target.files[0]) {
    document.getElementById("imageStatus").innerText = "✅ Fail dipilih. Akan dimuat naik automatik semasa publish.";
  }
});

/* =========================================
   SAVE / UPDATE PROPERTY (AUTO UPLOAD TO IMGBB)
========================================= */
async function saveProperty() {
  const zone = document.getElementById("propertyZone").value;
  const name = document.getElementById("propertyName").value.trim().toUpperCase();
  const price = document.getElementById("propertyPrice").value.replace(/[^0-9]/g, "");
  const location = document.getElementById("propertyLocation").value.trim();
  const description = document.getElementById("propertyDescription").value.trim();
  const status = document.getElementById("propertyStatus").value;
  const imageFileInput = document.getElementById("propertyImageFile");

  if (!name || !price || !location) {
    alert("Sila isi Nama Property, Harga dan Lokasi.");
    return;
  }

  const publishBtn = document.querySelector(".publish-button");
  publishBtn.disabled = true;

  try {
    let imageUrl = currentImageUrl;

    if (imageFileInput.files.length > 0) {
      publishBtn.innerText = "⏳ Sedang upload gambar ke ImgBB...";
      const base64Image = await fileToBase64(imageFileInput.files[0]);

      const formData = new FormData();
      formData.append("key", IMGBB_API_KEY);
      formData.append("image", base64Image);

      const response = await fetch("https://api.imgbb.com/1/upload", {
        method: "POST",
        body: formData
      });

      const result = await response.json();
      if (result.success) {
        imageUrl = result.data.url;
      } else {
        throw new Error("Gagal upload ke ImgBB. Sila semak API Key anda.");
      }
    }

    publishBtn.innerText = "⏳ Sedang simpan ke Database...";

    const propertyData = {
      zone: zone,
      image: imageUrl,
      name: name,
      price: Number(price),
      location: location,
      description: description,
      status: status,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    if (editingId !== null) {
      await db.collection("properties").doc(editingId).update(propertyData);
      alert("Property berjaya dikemas kini!");
    } else {
      await db.collection("properties").add(propertyData);
      alert("Property berjaya dipublish!");
    }
    cancelEdit();
  } catch (error) {
       console.error("Ralat Terperinci: ", error);
    alert("Ralat: " + error.message);
  } finally {
    publishBtn.innerText = "🚀 PUBLISH PROPERTY";
    publishBtn.disabled = false;
  }
}

/* =========================================
   MANAGE LISTINGS (ADMIN)
========================================= */
function renderManageListings() {
  const list = document.getElementById("manageList");
  if (properties.length === 0) {
    list.innerHTML = `<div class="empty">Belum ada listing.</div>`;
    return;
  }

  list.innerHTML = properties.map(property => {
    return `
    <div class="property-card">
      <img class="property-image" src="${escapeHTML(property.image)}" alt="${escapeHTML(property.name)}" loading="lazy">
      <div class="property-content">
        <span class="status ${getStatusClass(property.status)}">${escapeHTML(property.status)}</span>
        <h3 class="property-name">${escapeHTML(property.name)}</h3>
        <div class="price">${formatPrice(property.price)}</div>
        <div class="location">📍 ${escapeHTML(property.location)}</div>
        <p class="description">Zone: <b>${escapeHTML(property.zone)}</b></p>
        <button class="edit-button" onclick="editProperty('${property.id}')">EDIT</button>
        <button class="delete-button" onclick="deleteProperty('${property.id}')">DELETE</button>
      </div>
    </div>`;
  }).join("");
}

function editProperty(id) {
  const property = properties.find(item => item.id === id);
  if (!property) return;
  
  editingId = id;
  currentImageUrl = property.image;

  document.getElementById("propertyZone").value = property.zone;
  document.getElementById("propertyName").value = property.name;
  document.getElementById("propertyPrice").value = property.price;
  document.getElementById("propertyLocation").value = property.location;
  document.getElementById("propertyDescription").value = property.description;
  document.getElementById("propertyStatus").value = property.status;
  document.getElementById("propertyImageFile").value = "";
  document.getElementById("imageStatus").innerText = "Gunakan gambar sedia ada (pilih fail baru jika mahu tukar).";

  document.getElementById("formTitle").innerText = "✏️ Edit Property";
  document.getElementById("cancelEditButton").classList.remove("hidden");
  window.scrollTo(0, 0);
}

function cancelEdit() {
  editingId = null;
  currentImageUrl = "https://placehold.co/800x500?text=Property+Photo";
  document.getElementById("formTitle").innerText = "➕ Tambah Property";
  document.getElementById("cancelEditButton").classList.add("hidden");
  document.getElementById("propertyZone").value = "Sandakan";
  document.getElementById("propertyImageFile").value = "";
  document.getElementById("propertyName").value = "";
  document.getElementById("propertyPrice").value = "";
  document.getElementById("propertyLocation").value = "";
  document.getElementById("propertyDescription").value = "";
  document.getElementById("propertyStatus").value = "Available";
  document.getElementById("imageStatus").innerText = "";
}

async function deleteProperty(id) {
  if (!confirm("Adakah anda pasti mahu delete property ini?")) return;
  try {
    await db.collection("properties").doc(id).delete();
    alert("Property telah dipadam.");
  } catch (error) {
    console.error("Ralat memadam:", error);
  }
}

// Muat turun data awam apabila laman web dibuka
loadPublicProperties();
</script>

</body>
</html><script async src="/.netlify/scripts/hud?variant=public" data-nf-variant="public" data-netlify-site-id="bcea4e00-7e0c-47fe-908f-1a1cb8191c35" data-app-host="app.netlify.com"></script>
