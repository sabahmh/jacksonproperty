<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jackson Property – Awan Mas, Sandakan</title>

<style>
:root{
  --ink:#172033;
  --blue:#173b72;
  --pink:#ec4899;
  --green:#16a34a;
  --yellow:#f59e0b;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:#f3f5f9;
  color:var(--ink);
  font:15px Arial,sans-serif;
  overflow-x:hidden;
}

header{
  background:var(--blue);
  color:#fff;
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

h1{
  font-size:18px;
  margin:0;
}

header small{opacity:.85}

main{
  max-width:100%;
  margin:auto;
  padding:6px;
}

.toolbar{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-bottom:8px;
  align-items:center;
}

button,.btn{
  border:0;
  border-radius:8px;
  padding:8px 12px;
  background:var(--blue);
  color:white;
  cursor:pointer;
  font-weight:600;
  font-size:13px;
}

button.secondary{background:#64748b}
button.active{background:#0f766e}

input,select{
  padding:8px;
  border:1px solid #cbd5e1;
  border-radius:7px;
  font-size:13px;
}

/* Statistik */
.stats{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:4px;
  margin:6px 0;
}

.stat{
  background:white;
  border:1px solid #e2e8f0;
  border-radius:7px;
  padding:6px 2px;
  text-align:center;
  font-size:11px;
  min-width:0;
}

/* Workspace dan pelan FULL FIT */
.workspace{
  background:white;
  border:1px solid #dbe2ea;
  border-radius:8px;
  overflow:hidden;
  padding:0;
  position:relative;
  width:100%;
  touch-action:none;
  cursor:grab;
  user-select:none;
  -webkit-user-select:none;
}

.workspace:active{
  cursor:grabbing;
}

#stage{
  position:relative;
  width:100%;
  height:100%;
  margin:0 auto;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
  transform-origin:0 0;
  will-change:transform;
  display:flex;
  align-items:center;
  justify-content:center;
}

#plan{
  display:block;
  width:100%;
  height:auto;
  max-width:100%;
  pointer-events:none;
  -webkit-user-drag:none;
  object-fit: contain;
}

#overlay{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  touch-action:none;
  overflow:visible;
}

.lot{
  stroke:#1d4ed8;
  stroke-width:1.4;
  fill:#ffffff;
  fill-opacity:.08;
  cursor:pointer;
}

.lot.bumi{
  fill:#ec4899;
  fill-opacity:.55;
  stroke:#be185d;
}

.lot.sold{
  fill:#64748b;
  fill-opacity:.38;
  stroke:#334155;
}

.lot.hold{
  fill:#fbbf24;
  fill-opacity:.5;
  stroke:#b45309;
}

.lot.booked{
  fill:#60a5fa;
  fill-opacity:.5;
  stroke:#1d4ed8;
}

.lottext{
  font-size:12px;
  font-weight:bold;
  fill:#111827;
  paint-order:stroke;
  stroke:white;
  stroke-width:2px;
  stroke-linejoin:round;
  pointer-events:none;
  text-anchor:middle;
}

.cross{
  stroke:#dc2626;
  stroke-width:2.5;
  pointer-events:none;
}

.note{
  color:#64748b;
  font-size:12px;
  margin:8px 2px;
}

#drawHint{
  display:none;
  background:#fff7ed;
  color:#9a3412;
  padding:8px;
  border-radius:8px;
  margin-bottom:8px;
  font-size:12px;
}

/* Modal */
.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:5;
}

.panel{
  background:white;
  padding:20px;
  border-radius:14px;
  width:min(420px,100%);
  box-shadow:0 15px 50px #0003;
  max-height: 90vh;
  overflow-y: auto;
}

.panel h2{margin-top:0}

.field{
  display:grid;
  gap:5px;
  margin:12px 0;
}

.actions{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  margin-top:18px;
}

.field input,
.field select{
  width:100%;
  min-width:0;
}

/* Paparan telefon khusus */
@media(max-width:600px){
  header{
    padding:8px 12px;
  }
  h1{font-size:14px}
  header small{font-size:10px}
  header>div:last-child{font-size:10px}
  main{padding:4px}
  .toolbar{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:4px;
    margin-bottom:6px;
  }
  #drawBtn{grid-column:span 2}
}
</style>
</head>

<body>

<header>
  <div>
    <h1>Jackson Property – Awan Mas</h1>
    <small>Site Plan • Phase 1</small>
  </div>

  <div>
    Lot Management<br>
    <small id="syncStatus">Menyambung ke Firebase…</small>
  </div>
</header>

<main>

<div class="toolbar">

  <button id="viewBtn" class="active" onclick="setMode('view')">
    👁 Papar
  </button>

  <button id="editBtn" onclick="setMode('edit')">
    ✏️ Edit
  </button>

  <button id="drawBtn" class="secondary" onclick="toggleDraw()">
    ＋ Tambah / Lukis Lot
  </button>

  <select id="filterStatus" onchange="render()">
    <option value="">Semua Status</option>
    <option>AVAILABLE</option>
    <option>HOLD</option>
    <option>BOOKED</option>
    <option>SOLD</option>
  </select>

  <select id="filterType" onchange="render()">
    <option value="">Semua Lot</option>
    <option>BUMI</option>
    <option>NON-BUMI</option>
  </select>

</div>

<div id="drawHint">
  Mode lukis aktif: klik dan seret pada pelan untuk menandakan kawasan lot.
</div>

<!-- Statistik -->
<div class="stats" id="stats"></div>

<!-- Pelan lot (Full Fit Screen) -->
<div class="workspace" id="workspace">

  <div id="stage">

    <img
      id="plan"
      src="awanmas2plan.jpg"
      alt="Site Plan Awan Mas"
      draggable="false"
    >

    <svg
      id="overlay"
      viewBox="0 0 826 1024"
      preserveAspectRatio="none"
    ></svg>

  </div>

</div>

<p class="note">
  Nota: Swipe untuk gerakkan pelan. Pinch dua jari untuk zoom skrin.
</p>

</main>

<!-- Modal Lot -->
<div class="modal" id="modal">

  <div class="panel">

    <h2 id="modalTitle">Edit Lot</h2>

    <div class="field">
      <label>Nombor / Nama Lot</label>
      <input id="lotNum">
    </div>

    <div class="field">
      <label>Status</label>
      <select id="lotStatus">
        <option>AVAILABLE</option>
        <option>HOLD</option>
        <option>BOOKED</option>
        <option>SOLD</option>
      </select>
    </div>

    <div class="field">
      <label>Harga (RM)</label>
      <input id="lotPrice" placeholder="Contoh: 299000">
    </div>

    <div class="field">
      <label>Kategori</label>
      <select id="lotType">
        <option>BUMI</option>
        <option>NON-BUMI</option>
      </select>
    </div>

    <div class="field" id="rotationField">
      <label>Sudut Putaran / Senget (Darjah)</label>
      <input type="number" id="lotRotation" value="0" placeholder="Contoh: 15 atau -15">
    </div>

    <div class="field">
      <label>Remark</label>
      <input id="lotRemark" placeholder="Catatan (optional)">
    </div>

    <div class="actions">

      <button class="secondary" onclick="closeModal()">
        Batal
      </button>

      <button
        id="deleteBtn"
        class="secondary"
        onclick="deleteLot()"
      >
        Padam
      </button>

      <button onclick="saveLot()">
        Simpan
      </button>

    </div>

  </div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

/* =====================================
   FIREBASE CONFIGURATION
===================================== */

const firebaseConfig = {
  apiKey: "AIzaSyCIB8qLZWjGVitHnJzS58BHPYoYdD_i7uM",
  authDomain: "listing-2a59c.firebaseapp.com",
  projectId: "listing-2a59c",
  storageBucket: "listing-2a59c.firebasestorage.app",
  messagingSenderId: "363739620416",
  appId: "1:363739620416:web:b14bd9043ac09a8032eba5",
  measurementId: "G-SZ47HNR9PT"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

const COLLECTION = 'awanmas_lots';
const lotsRef = db.collection(COLLECTION);

const svg = document.getElementById('overlay');
const workspace = document.getElementById('workspace');
const stage = document.getElementById('stage');

let lots = JSON.parse(
  localStorage.getItem('awanmasLots') || '[]'
);

let mode = 'view';
let drawing = false;
let start = null;
let draft = null;
let editingId = null;

let draggingLot = null;
let dragOffset = { x: 0, y: 0 };
let isDraggingLot = false;

let applyingRemote = false;
let dbReady = false;

let scale = 1;
let offsetX = 0;
let offsetY = 0;

let pointers = new Map();
let startDistance = 0;
let startScale = 1;
let startX = 0;
let startY = 0;
let startOffsetX = 0;
let startOffsetY = 0;
let hasMoved = false;
let suppressClick = false;

const MIN_SCALE = 1;
const MAX_SCALE = 5;

function setSyncStatus(message,color){
  const el = document.getElementById('syncStatus');
  if(el){
    el.textContent = message;
    el.style.color = color || '#fff';
  }
}

function cacheLots(){
  localStorage.setItem('awanmasLots', JSON.stringify(lots));
}

function updateDrawUI(){
  document.getElementById('drawBtn').classList.toggle('active',drawing);
  document.getElementById('drawHint').style.display = drawing ? 'block' : 'none';
  svg.style.cursor = drawing ? 'crosshair' : 'default';
}

function setMode(m){
  mode = m;
  document.getElementById('viewBtn').classList.toggle('active',m === 'view');
  document.getElementById('editBtn').classList.toggle('active',m === 'edit');
  if(m === 'view'){
    drawing = false;
    start = null;
    if(draft instanceof SVGRectElement) draft.remove();
    draft = null;
  }
  updateDrawUI();
}

function toggleDraw(force){
  const next = force === undefined ? !drawing : !!force;
  if(next) setMode('edit');
  drawing = next;
  updateDrawUI();
  if(drawing){
    setSyncStatus('Mode lukis aktif — seret pada pelan untuk lukis lot', '#fde68a');
  }
}

function point(e){
  const r = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  return {
    x:(e.clientX-r.left)/r.width*vb.width,
    y:(e.clientY-r.top)/r.height*vb.height
  };
}

lotsRef.onSnapshot(snapshot => {
  applyingRemote = true;
  const remote = snapshot.docs.map(doc => ({
    ...doc.data(),
    id:doc.id
  }));

  if(snapshot.empty && lots.length){
    const batch = db.batch();
    lots.forEach((lot,i) => {
      const id = String(lot.id || (Date.now()+'-'+i));
      batch.set(lotsRef.doc(id), {...lot,id});
    });
    batch.commit().then(() => {
      setSyncStatus('✓ Data tempatan dimuat naik', '#bbf7d0');
    }).finally(() => {
      applyingRemote = false;
      dbReady = true;
    });
    return;
  }

  lots = remote;
  cacheLots();
  render();
  dbReady = true;
  applyingRemote = false;
  setSyncStatus('✓ Firebase Realtime aktif', '#bbf7d0');
},error => {
  dbReady = false;
  applyingRemote = false;
  setSyncStatus('Firebase gagal', '#fecaca');
});

function pointInBounds(l){
  return l && [l.x, l.y, l.w, l.h].every(v => Number.isFinite(Number(v)));
}

function render(){
  svg.innerHTML = '';
  const statusFilter = document.getElementById('filterStatus').value;
  const typeFilter = document.getElementById('filterType').value;

  const shown = lots.filter(l =>
    (!statusFilter || l.status === statusFilter) &&
    (!typeFilter || l.type === typeFilter)
  );

  shown.forEach(l => {
    if(!pointInBounds(l)) return;

    const g = document.createElementNS(svg.namespaceURI, 'g');
    const r = document.createElementNS(svg.namespaceURI, 'rect');

    r.setAttribute('x',l.x);
    r.setAttribute('y',l.y);
    r.setAttribute('width',l.w);
    r.setAttribute('height',l.h);
    r.setAttribute('rx',1);

    r.setAttribute(
      'class',
      'lot '+
      (
        l.status === 'SOLD' ? 'sold' :
        l.status === 'HOLD' ? 'hold' :
        l.status === 'BOOKED' ? 'booked' :
        l.type === 'BUMI' ? 'bumi' : ''
      )
    );
    g.appendChild(r);

    const t = document.createElementNS(svg.namespaceURI, 'text');
    t.setAttribute('x', Number(l.x)+Number(l.w)/2);
    t.setAttribute('y', Number(l.y)+Number(l.h)/2+4);
    t.setAttribute('class','lottext');
    t.textContent = l.num || 'Lot';
    g.appendChild(t);

    if(l.status === 'SOLD'){
      const a = document.createElementNS(svg.namespaceURI, 'line');
      const b = document.createElementNS(svg.namespaceURI, 'line');
      [['x1',Number(l.x)+Number(l.w)*.2],['y1',Number(l.y)+Number(l.h)*.2],['x2',Number(l.x)+Number(l.w)*.8],['y2',Number(l.y)+Number(l.h)*.8]].forEach(v=>a.setAttribute(v[0],v[1]));
      [['x1',Number(l.x)+Number(l.w)*.8],['y1',Number(l.y)+Number(l.h)*.2],['x2',Number(l.x)+Number(l.w)*.2],['y2',Number(l.y)+Number(l.h)*.8]].forEach(v=>b.setAttribute(v[0],v[1]));
      a.setAttribute('class','cross');
      b.setAttribute('class','cross');
      g.append(a,b);
    }

    const rot = Number(l.rotation) || 0;
    if(rot !== 0) {
      const cx = Number(l.x) + Number(l.w) / 2;
      const cy = Number(l.y) + Number(l.h) / 2;
      g.setAttribute('transform', `rotate(${rot}, ${cx}, ${cy})`);
    }

    g.style.cursor = mode === 'edit' ? 'move' : 'pointer';

    g.addEventListener('pointerdown', e => {
      if(drawing || mode !== 'edit') return;
      e.stopPropagation();
      draggingLot = l;
      isDraggingLot = true;
      hasMoved = false;
      const pt = point(e);
      dragOffset.x = pt.x - Number(l.x);
      dragOffset.y = pt.y - Number(l.y);
      g.setPointerCapture(e.pointerId);
    });

    g.addEventListener('pointermove', e => {
      if(!isDraggingLot || draggingLot !== l) return;
      e.stopPropagation();
      hasMoved = true;
      const pt = point(e);
      l.x = pt.x - dragOffset.x;
      l.y = pt.y - dragOffset.y;
      render();
    });

    g.addEventListener('pointerup', async e => {
      if(!isDraggingLot || draggingLot !== l) return;
      e.stopPropagation();
      isDraggingLot = false;
      draggingLot = null;
      if(hasMoved){
        suppressClick = true;
        try {
          await lotsRef.doc(String(l.id)).set({
            x: Number(l.x),
            y: Number(l.y),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });
        } catch(err) {
          console.error(err);
        }
      }
    });

    g.addEventListener('click', e => {
      if(suppressClick) return;
      e.stopPropagation();
      openModal(l);
    });

    svg.appendChild(g);
  });

  const counts = { AVAILABLE:0, HOLD:0, BOOKED:0, SOLD:0 };
  lots.forEach(l => { if(counts[l.status] !== undefined) counts[l.status]++; });

  const bumiAvailable = lots.filter(l => l.status === 'AVAILABLE' && l.type === 'BUMI').length;
  const nonBumiAvailable = lots.filter(l => l.status === 'AVAILABLE' && l.type === 'NON-BUMI').length;

  document.getElementById('stats').innerHTML =
    Object.entries(counts).map(([k,v]) => `<div class="stat"><b>${k}</b>: ${v}</div>`).join('') +
    `<div class="stat"><b>BUMI</b>: ${bumiAvailable}</div>` +
    `<div class="stat"><b>NON-BUMI</b>: ${nonBumiAvailable}</div>` +
    `<div class="stat"><b>Jumlah</b>: ${lots.length}</div>`;
}

function setFormReadOnly(readOnly){
  ['lotNum', 'lotStatus', 'lotPrice', 'lotType', 'lotRotation', 'lotRemark'].forEach(id => {
    document.getElementById(id).disabled = readOnly;
  });
  
  // Sembunyikan ruang sudut putaran sepenuhnya semasa mode Papar (readOnly)
  document.getElementById('rotationField').style.display = readOnly ? 'none' : 'grid';

  document.getElementById('deleteBtn').style.display = (!readOnly && editingId) ? 'inline-block' : 'none';
  document.querySelector('#modal .actions button:last-child').style.display = readOnly ? 'none' : 'inline-block';
  document.querySelector('#modal .actions button:first-child').textContent = readOnly ? 'Tutup' : 'Batal';
}

function openModal(l,coords){
  const readOnly = mode === 'view' && !coords;
  if(mode === 'view' && !coords && !l) return;
  editingId = l ? String(l.id) : null;
  document.getElementById('modalTitle').textContent = l ? (readOnly ? 'Maklumat Lot ' : 'Edit Lot ') + (l.num || '') : 'Lot Baru';
  document.getElementById('lotNum').value = l ? (l.num || '') : '';
  document.getElementById('lotStatus').value = l ? (l.status || 'AVAILABLE') : 'AVAILABLE';
  document.getElementById('lotPrice').value = l ? (l.price || '') : '';
  document.getElementById('lotType').value = l ? (l.type || 'BUMI') : 'BUMI';
  document.getElementById('lotRotation').value = l ? (l.rotation || 0) : 0;
  document.getElementById('lotRemark').value = l ? (l.remark || '') : '';
  draft = coords || (l ? {x:l.x, y:l.y, w:l.w, h:l.h} : null);
  setFormReadOnly(readOnly);
  document.getElementById('modal').style.display = 'flex';
}

function closeModal(){
  document.getElementById('modal').style.display = 'none';
  draft = null;
  setFormReadOnly(false);
}

async function saveLot(){
  if(mode !== 'edit') return;
  const num = document.getElementById('lotNum').value.trim();
  if(!num){ alert('Masukkan nombor lot'); return; }
  if(!draft){ alert('Kawasan lot tidak dijumpai.'); return; }

  const id = editingId || (Date.now().toString() + Math.random().toString(36).slice(2,7));
  const data = {
    id,
    num,
    status: document.getElementById('lotStatus').value,
    price: document.getElementById('lotPrice').value.trim(),
    type: document.getElementById('lotType').value,
    rotation: Number(document.getElementById('lotRotation').value) || 0,
    remark: document.getElementById('lotRemark').value.trim(),
    x: Number(draft.x),
    y: Number(draft.y),
    w: Number(draft.w),
    h: Number(draft.h),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  try{
    setSyncStatus('Menyimpan...', '#fde68a');
    await lotsRef.doc(id).set(data, {merge:true});
    closeModal();
    setSyncStatus('✓ Lot disimpan', '#bbf7d0');
  }catch(err){
    alert('Gagal: '+err.message);
  }
}

async function deleteLot(){
  if(!editingId || mode !== 'edit') return;
  if(!confirm('Padam lot ini?')) return;
  try{
    await lotsRef.doc(editingId).delete();
    closeModal();
    setSyncStatus('✓ Lot dipadam', '#bbf7d0');
  }catch(err){
    alert('Gagal: '+err.message);
  }
}

function applyTransform(){
  stage.style.transform = `translate(${offsetX}px,${offsetY}px) scale(${scale})`;
}

function getDistance(a,b){
  return Math.hypot(a.x-b.x, a.y-b.y);
}

workspace.addEventListener('pointerdown',e=>{
  if(drawing || isDraggingLot) return;
  if(e.pointerType === 'mouse' && e.button !== 0) return;
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size === 1){
    startX = e.clientX; startY = e.clientY;
    startOffsetX = offsetX; startOffsetY = offsetY;
    hasMoved = false;
  }
  if(pointers.size === 2){
    const p = [...pointers.values()];
    startDistance = getDistance(p[0],p[1]);
    startScale = scale;
    hasMoved = true;
  }
});

window.addEventListener('pointermove',e=>{
  if(drawing || isDraggingLot) return;
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size === 1){
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if(Math.abs(dx)>4 || Math.abs(dy)>4) hasMoved = true;
    offsetX = startOffsetX + dx;
    offsetY = startOffsetY + dy;
    applyTransform();
  }
  if(pointers.size === 2){
    const p = [...pointers.values()];
    const newDistance = getDistance(p[0],p[1]);
    if(startDistance > 0){
      const newScale = startScale * (newDistance / startDistance);
      const rect = workspace.getBoundingClientRect();
      const centerX = (p[0].x + p[1].x)/2 - rect.left;
      const centerY = (p[0].y + p[1].y)/2 - rect.top;
      const nextScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
      const ratio = nextScale / scale;
      offsetX = centerX - (centerX - offsetX)*ratio;
      offsetY = centerY - (centerY - offsetY)*ratio;
      scale = nextScale;
      hasMoved = true;
      applyTransform();
    }
  }
},{passive:true});

function endPan(e){
  if(!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if(pointers.size === 1){
    const p = [...pointers.values()][0];
    startX = p.x; startY = p.y;
    startOffsetX = offsetX; startOffsetY = offsetY;
    startDistance = 0;
  }
  if(pointers.size === 0){
    startDistance = 0;
    if(hasMoved){
      suppressClick = true;
      setTimeout(()=>{ suppressClick = false; hasMoved = false; }, 400);
    }
  }
}

window.addEventListener('pointerup', endPan);
window.addEventListener('pointercancel', endPan);

workspace.addEventListener('click', e=>{
  if(suppressClick){ e.preventDefault(); e.stopPropagation(); suppressClick = false; hasMoved = false; }
}, true);

svg.addEventListener('pointerdown', e=>{
  if(!drawing || mode !== 'edit' || isDraggingLot) return;
  e.preventDefault();
  start = point(e);
  draft = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  draft.setAttribute('class', 'lot bumi');
  svg.appendChild(draft);
  svg.setPointerCapture(e.pointerId);
});

svg.addEventListener('pointermove', e=>{
  if(!start || !draft || !(draft instanceof SVGRectElement)) return;
  const p = point(e);
  draft.setAttribute('x', Math.min(start.x, p.x));
  draft.setAttribute('y', Math.min(start.y, p.y));
  draft.setAttribute('width', Math.abs(p.x - start.x));
  draft.setAttribute('height', Math.abs(p.y - start.y));
});

function finishDrawing(){
  if(!start || !draft || !(draft instanceof SVGRectElement)) return;
  const x = Number(draft.getAttribute('x'));
  const y = Number(draft.getAttribute('y'));
  const w = Number(draft.getAttribute('width'));
  const h = Number(draft.getAttribute('height'));
  draft.remove();
  start = null;
  draft = null;
  if(w < 5 || h < 5) return;
  openModal(null, {x, y, w, h});
}

svg.addEventListener('pointerup', finishDrawing);
svg.addEventListener('pointercancel', finishDrawing);

function updatePlanSize(){
  const im = document.getElementById('plan');
  if(im.naturalWidth && im.naturalHeight){
    svg.setAttribute('viewBox', `0 0 ${im.naturalWidth} ${im.naturalHeight}`);
    
    const availableHeight = window.innerHeight - workspace.getBoundingClientRect().top - 30;
    if(availableHeight > 300) {
      workspace.style.height = availableHeight + 'px';
    }
    render();
  }
}

window.addEventListener('resize', updatePlanSize);

document.getElementById('modal').addEventListener('click', e=>{
  if(e.target.id === 'modal') closeModal();
});

document.addEventListener('keydown', e=>{
  if(e.key === 'Escape') closeModal();
});

document.getElementById('plan').addEventListener('load', updatePlanSize);
document.getElementById('plan').addEventListener('error', ()=>{
  console.error('Gagal memuatkan awanmas2plan.jpg');
});

updatePlanSize();
render();

</script>

</body>
