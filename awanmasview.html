<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jackson Property – Awan Mas, Sandakan</title>

<style>
:root{
  --ink:#172033;
  --blue:#173b72;
  --pink:#ec4899;
  --green:#16a34a;
  --yellow:#f59e0b;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:#f3f5f9;
  color:var(--ink);
  font:15px Arial,sans-serif;
}

header{
  background:var(--blue);
  color:#fff;
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

h1{
  font-size:20px;
  margin:0;
}

header small{opacity:.85}

main{
  max-width:1400px;
  margin:auto;
  padding:14px;
}

.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:12px;
  align-items:center;
}

button,.btn{
  border:0;
  border-radius:8px;
  padding:10px 13px;
  background:var(--blue);
  color:white;
  cursor:pointer;
  font-weight:600;
}

button.secondary{background:#64748b}
button.active{background:#0f766e}

input,select{
  padding:9px;
  border:1px solid #cbd5e1;
  border-radius:7px;
  min-width:100px;
}

/* Statistik */
.stats{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px;
  margin:10px 0;
}

.stat{
  background:white;
  border:1px solid #e2e8f0;
  border-radius:99px;
  padding:8px 13px;
  text-align:center;
  min-width:0;
}

/* Workspace dan pelan */
.workspace{
  background:white;
  border:1px solid #dbe2ea;
  border-radius:10px;
  overflow:hidden;
  padding:3px;
  position:relative;
  width:100%;

  /* Pan dan zoom */
  touch-action:none;
  cursor:grab;
  user-select:none;
  -webkit-user-select:none;
}

.workspace:active{
  cursor:grabbing;
}

#stage{
  position:relative;
  width:100%;
  max-width:100%;
  margin:0 auto;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
  transform-origin:0 0;
  will-change:transform;
}

#plan{
  display:block;
  width:100%;
  height:auto;
  max-width:100%;
  pointer-events:none;
  -webkit-user-drag:none;
}

#overlay{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  touch-action:none;
  overflow:visible;
}

.lot{
  stroke:#1d4ed8;
  stroke-width:1.4;
  fill:#ffffff;
  fill-opacity:.08;
  cursor:pointer;
}

.lot.bumi{
  fill:#ec4899;
  fill-opacity:.55;
  stroke:#be185d;
}

.lot.sold{
  fill:#64748b;
  fill-opacity:.38;
  stroke:#334155;
}

.lot.hold{
  fill:#fbbf24;
  fill-opacity:.5;
  stroke:#b45309;
}

.lot.booked{
  fill: #a855f7;
  fill-opacity: .55;
  stroke: #ef4444;
}

.lottext{
  font-size:12px;
  font-weight:bold;
  fill:#111827;
  paint-order:stroke;
  stroke:white;
  stroke-width:2px;
  stroke-linejoin:round;
  pointer-events:none;
  text-anchor:middle;
}

.cross{
  stroke:#dc2626;
  stroke-width:2.5;
  pointer-events:none;
}

.note{
  color:#64748b;
  font-size:13px;
  margin:10px 2px;
}

/* Modal */
.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:5;
}

.panel{
  background:white;
  padding:20px;
  border-radius:14px;
  width:min(420px,100%);
  box-shadow:0 15px 50px #0003;
  max-height: 90vh;
  overflow-y: auto;
}

.panel h2{margin-top:0}

.field{
  display:grid;
  gap:5px;
  margin:12px 0;
}

.actions{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  margin-top:18px;
}

.field input,
.field select{
  width:100%;
  min-width:0;
}

/* Paparan telefon */
@media(max-width:600px){

  body{font-size:13px}

  header{
    padding:9px 11px;
    gap:5px;
  }

  h1{font-size:15px}

  header small{font-size:11px}

  header>div:last-child{font-size:11px}

  main{padding:5px}

  .toolbar{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:5px;
    margin-bottom:7px;
  }

  .toolbar select{
    width:100%;
    min-width:0;
    padding:8px 5px;
    font-size:12px;
    border-radius:7px;
  }

  .stats{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:4px;
    margin:6px 0;
  }

  .stat{
    padding:6px 2px;
    text-align:center;
    font-size:10px;
    border-radius:6px;
    white-space:nowrap;
    min-width:0;
  }

  .workspace{
    padding:1px;
    border-radius:6px;
    min-height: 500px;
  }

  .note{font-size:11px}

  .panel{padding:15px}

  .field{margin:9px 0}
}

@media(max-width:360px){

  .toolbar select{
    font-size:11px;
  }

  .stat{
    font-size:9px;
    padding:5px 1px;
  }
}
</style>
</head>

<body>

<header>
  <div>
    <h1>Jackson Property – Awan Mas, Sandakan</h1>
    <small>Site Plan • Phase 2</small>
  </div>

  <div>
    Lot Status<br>
    <small id="syncStatus">Menyambung ke Firebase…</small>
  </div>
</header>

<main>

<div class="toolbar">

  <select id="filterStatus" onchange="render()">
    <option value="">Semua Status</option>
    <option>AVAILABLE</option>
    <option>HOLD</option>
    <option>BOOKED</option>
    <option>SOLD</option>
  </select>

  <select id="filterType" onchange="render()">
    <option value="">Semua Lot</option>
    <option>BUMI</option>
    <option>NON-BUMI</option>
  </select>

</div>

<!-- Statistik -->
<div class="stats" id="stats"></div>

<!-- Pelan lot -->
<div class="workspace" id="workspace">

  <div id="stage">

    <img
      id="plan"
      src="awanmas2plan.jpg"
      alt="Site Plan Awan Mas"
      draggable="false"
    >

    <svg
      id="overlay"
      viewBox="0 0 826 1024"
      preserveAspectRatio="none"
    ></svg>

  </div>

</div>

<p class="note">
  Nota: Klik lot untuk melihat maklumat terperinci.
  <br>
  Telefon: Swipe untuk gerakkan pelan. Pinch dua jari untuk zoom.
  Komputer: Drag menggunakan tetikus dan scroll untuk zoom.
</p>

</main>

<!-- Modal Lot -->
<div class="modal" id="modal">

  <div class="panel">

    <h2 id="modalTitle">Maklumat Lot</h2>

    <div class="field">
      <label>Nombor / Nama Lot</label>
      <input id="lotNum" disabled>
    </div>

    <div class="field">
      <label>Status</label>
      <select id="lotStatus" disabled>
        <option>AVAILABLE</option>
        <option>HOLD</option>
        <option>BOOKED</option>
        <option>SOLD</option>
      </select>
    </div>

    <div class="field">
      <label>Harga (RM)</label>
      <input id="lotPrice" placeholder="-" disabled>
    </div>

    <div class="field">
      <label>Kategori</label>
      <select id="lotType" disabled>
        <option>BUMI</option>
        <option>NON-BUMI</option>
      </select>
    </div>

    <div class="field">
      <label>Remark</label>
      <input id="lotRemark" placeholder="Tiada" disabled>
    </div>

    <div class="actions">

      <button onclick="closeModal()">
        Tutup
      </button>

    </div>

  </div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

/* =====================================
   FIREBASE CONFIGURATION
===================================== */

const firebaseConfig = {
  apiKey: "AIzaSyCIB8qLZWjGVitHnJzS58BHPYoYdD_i7uM",
  authDomain: "listing-2a59c.firebaseapp.com",
  projectId: "listing-2a59c",
  storageBucket: "listing-2a59c.firebasestorage.app",
  messagingSenderId: "363739620416",
  appId: "1:363739620416:web:b14bd9043ac09a8032eba5",
  measurementId: "G-SZ47HNR9PT"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

const COLLECTION = 'awanmas_lots';
const lotsRef = db.collection(COLLECTION);

const svg = document.getElementById('overlay');
const workspace = document.getElementById('workspace');
const stage = document.getElementById('stage');

let lots = JSON.parse(
  localStorage.getItem('awanmasLots') || '[]'
);

const mode = 'view';
let editingId = null;

let applyingRemote = false;
let dbReady = false;


/* =====================================
   PAN & ZOOM VARIABLES
===================================== */

let scale = 1;
let offsetX = 0;
let offsetY = 0;

let pointers = new Map();

let startDistance = 0;
let startScale = 1;

let startX = 0;
let startY = 0;

let startOffsetX = 0;
let startOffsetY = 0;

let hasMoved = false;
let suppressClick = false;

const MIN_SCALE = 1;
const MAX_SCALE = 5;


/* =====================================
   FIREBASE STATUS
===================================== */

function setSyncStatus(message,color){

  const el = document.getElementById('syncStatus');

  if(el){
    el.textContent = message;
    el.style.color = color || '#fff';
  }

}


function cacheLots(){

  localStorage.setItem(
    'awanmasLots',
    JSON.stringify(lots)
  );

}


/* =====================================
   COORDINATES
===================================== */

function point(e){

  const r = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;

  return {
    x:(e.clientX-r.left)/r.width*vb.width,
    y:(e.clientY-r.top)/r.height*vb.height
  };

}


/* =====================================
   FIREBASE REALTIME LISTENER
===================================== */

lotsRef.onSnapshot(snapshot => {

  applyingRemote = true;

  const remote = snapshot.docs.map(doc => ({
    ...doc.data(),
    id:doc.id
  }));

  lots = remote;
  cacheLots();
  render();

  dbReady = true;
  applyingRemote = false;

  setSyncStatus(
    '✓ Data terkini diselaraskan',
    '#bbf7d0'
  );

},error => {

  dbReady = false;
  applyingRemote = false;

  setSyncStatus(
    'Sambungan gagal: '+(error.code || error.message),
    '#fecaca'
  );

  console.error('Firestore listener error:',error);

});


/* =====================================
   LOT VALIDATION
===================================== */

function pointInBounds(l){

  return l && [
    l.x,
    l.y,
    l.w,
    l.h
  ].every(v => Number.isFinite(Number(v)));

}


/* =====================================
   RENDER LOT
===================================== */

function render(){

  svg.innerHTML = '';

  const statusFilter =
    document.getElementById('filterStatus').value;

  const typeFilter =
    document.getElementById('filterType').value;

  const shown = lots.filter(l =>
    (!statusFilter || l.status === statusFilter) &&
    (!typeFilter || l.type === typeFilter)
  );


  shown.forEach(l => {

    if(!pointInBounds(l)) return;

    const g = document.createElementNS(
      svg.namespaceURI,
      'g'
    );

    const r = document.createElementNS(
      svg.namespaceURI,
      'rect'
    );

    r.setAttribute('x',l.x);
    r.setAttribute('y',l.y);
    r.setAttribute('width',l.w);
    r.setAttribute('height',l.h);
    r.setAttribute('rx',1);

    r.setAttribute(
      'class',
      'lot '+
      (
        l.status === 'SOLD' ? 'sold' :
        l.status === 'HOLD' ? 'hold' :
        l.status === 'BOOKED' ? 'booked' :
        l.type === 'BUMI' ? 'bumi' : ''
      )
    );

    g.appendChild(r);


    const t = document.createElementNS(
      svg.namespaceURI,
      'text'
    );

    t.setAttribute(
      'x',
      Number(l.x)+Number(l.w)/2
    );

    t.setAttribute(
      'y',
      Number(l.y)+Number(l.h)/2+4
    );

    t.setAttribute('class','lottext');

    t.textContent = l.num || 'Lot';

    g.appendChild(t);


    // Tanda X untuk SOLD

    if(l.status === 'SOLD'){

      const a = document.createElementNS(
        svg.namespaceURI,
        'line'
      );

      const b = document.createElementNS(
        svg.namespaceURI,
        'line'
      );

      [
        ['x1',Number(l.x)+Number(l.w)*.2],
        ['y1',Number(l.y)+Number(l.h)*.2],
        ['x2',Number(l.x)+Number(l.w)*.8],
        ['y2',Number(l.y)+Number(l.h)*.8]
      ].forEach(v => a.setAttribute(v[0],v[1]));

      [
        ['x1',Number(l.x)+Number(l.w)*.8],
        ['y1',Number(l.y)+Number(l.h)*.2],
        ['x2',Number(l.x)+Number(l.w)*.2],
        ['y2',Number(l.y)+Number(l.h)*.8]
      ].forEach(v => b.setAttribute(v[0],v[1]));

      a.setAttribute('class','cross');
      b.setAttribute('class','cross');

      g.append(a,b);

    }

    // Guna transform rotate jika sudut wujud
    const rot = Number(l.rotation) || 0;
    if(rot !== 0) {
      const cx = Number(l.x) + Number(l.w) / 2;
      const cy = Number(l.y) + Number(l.h) / 2;
      g.setAttribute('transform', `rotate(${rot}, ${cx}, ${cy})`);
    }

    g.style.cursor = 'pointer';

    // Klik lot untuk buka modal
    g.addEventListener('click', e => {
      if(suppressClick) return;
      e.stopPropagation();
      openModal(l);
    });

    svg.appendChild(g);

  });


  /* Statistik status */

  const counts = {
    AVAILABLE:0,
    HOLD:0,
    BOOKED:0,
    SOLD:0
  };

  lots.forEach(l => {
    if(counts[l.status] !== undefined){
      counts[l.status]++;
    }
  });

  const bumiAvailable = lots.filter(l =>
    l.status === 'AVAILABLE' && l.type === 'BUMI'
  ).length;

  const nonBumiAvailable = lots.filter(l =>
    l.status === 'AVAILABLE' && l.type === 'NON-BUMI'
  ).length;

  document.getElementById('stats').innerHTML =
    Object.entries(counts)
      .map(([k,v]) => `<div class="stat"><b>${k}</b>: ${v}</div>`)
      .join('') +
    `<div class="stat"><b>BUMI</b>: ${bumiAvailable}</div>` +
    `<div class="stat"><b>NON-BUMI</b>: ${nonBumiAvailable}</div>` +
    `<div class="stat"><b>Jumlah Lot</b>: ${lots.length}</div>`;

}


/* =====================================
   MODAL READ ONLY
===================================== */

function openModal(l){

  if(!l) return;

  editingId = String(l.id);

  // Paparkan nombor biasa atau '-' jika tiada
  let rawPrice = Number(l.price);
  let formattedPrice = !isNaN(rawPrice) && rawPrice > 0 
    ? rawPrice 
    : '-';

  document.getElementById('modalTitle').textContent = 'Maklumat Lot ' + (l.num || '');
  document.getElementById('lotNum').value = l.num || '';
  document.getElementById('lotStatus').value = l.status || 'AVAILABLE';
  document.getElementById('lotPrice').value = formattedPrice;
  document.getElementById('lotType').value = l.type || 'BUMI';
  document.getElementById('lotRemark').value = l.remark || 'Tiada';

  document.getElementById('modal').style.display = 'flex';

}


function closeModal(){
  document.getElementById('modal').style.display = 'none';
}


/* =====================================
   PAN & ZOOM
===================================== */

function applyTransform(){
  stage.style.transform = `translate(${offsetX}px,${offsetY}px) scale(${scale})`;
}

function getDistance(a,b){
  return Math.hypot(a.x-b.x, a.y-b.y);
}

workspace.addEventListener('pointerdown',e=>{
  if(e.pointerType === 'mouse' && e.button !== 0) return;

  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

  if(pointers.size === 1){
    startX = e.clientX;
    startY = e.clientY;
    startOffsetX = offsetX;
    startOffsetY = offsetY;
    hasMoved = false;
  }

  if(pointers.size === 2){
    const p = [...pointers.values()];
    startDistance = getDistance(p[0],p[1]);
    startScale = scale;
    hasMoved = true;
  }
});

window.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId)) return;

  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

  if(pointers.size === 1){
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if(Math.abs(dx)>4 || Math.abs(dy)>4) hasMoved = true;

    offsetX = startOffsetX + dx;
    offsetY = startOffsetY + dy;
    applyTransform();
  }

  if(pointers.size === 2){
    const p = [...pointers.values()];
    const newDistance = getDistance(p[0],p[1]);

    if(startDistance > 0){
      const newScale = startScale * (newDistance / startDistance);
      const rect = workspace.getBoundingClientRect();
      const centerX = (p[0].x + p[1].x)/2 - rect.left;
      const centerY = (p[0].y + p[1].y)/2 - rect.top;

      const nextScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
      const ratio = nextScale / scale;

      offsetX = centerX - (centerX - offsetX)*ratio;
      offsetY = centerY - (centerY - offsetY)*ratio;
      scale = nextScale;
      hasMoved = true;
      applyTransform();
    }
  }
},{passive:true});

function endPan(e){
  if(!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);

  if(pointers.size === 1){
    const p = [...pointers.values()][0];
    startX = p.x;
    startY = p.y;
    startOffsetX = offsetX;
    startOffsetY = offsetY;
    startDistance = 0;
  }

  if(pointers.size === 0){
    startDistance = 0;
    if(hasMoved){
      suppressClick = true;
      setTimeout(()=>{
        suppressClick = false;
        hasMoved = false;
      }, 400);
    }
  }
}

window.addEventListener('pointerup', endPan);
window.addEventListener('pointercancel', endPan);

workspace.addEventListener('click', e=>{
  if(suppressClick){
    e.preventDefault();
    e.stopPropagation();
    suppressClick = false;
    hasMoved = false;
  }
}, true);

workspace.addEventListener('wheel', e=>{
  e.preventDefault();

  const rect = workspace.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const oldScale = scale;
  const nextScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale * (e.deltaY < 15 ? 1.15 : 0.87)));
  const ratio = nextScale / oldScale;

  offsetX = x - (x - offsetX)*ratio;
  offsetY = y - (y - offsetY)*ratio;
  scale = nextScale;
  applyTransform();
},{passive:false});


/* =====================================
   PLAN IMAGE SIZE & MODAL
===================================== */

function updatePlanSize(){
  const im = document.getElementById('plan');
  if(im.naturalWidth && im.naturalHeight){
    svg.setAttribute('viewBox', `0 0 ${im.naturalWidth} ${im.naturalHeight}`);
    render();
  }
}

document.getElementById('modal').addEventListener('click', e=>{
  if(e.target.id === 'modal') closeModal();
});

document.addEventListener('keydown', e=>{
  if(e.key === 'Escape') closeModal();
});

document.getElementById('plan').addEventListener('load', updatePlanSize);
document.getElementById('plan').addEventListener('error', ()=>{
  console.error('Gagal memuatkan awanmas2plan.jpg');
});

updatePlanSize();
render();

</script>

</body>
</html>
