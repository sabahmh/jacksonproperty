<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Listing Hartanah Sabah</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-10 select-none text-[11px]" oncontextmenu="return false" onkeydown="return disableShortcuts(event)" x-data="propertyApp()">
    <!-- Header Ultra Kompak -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-2 py-1 shadow-2xs">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-1.5">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQh4BKiyvgK3c6XwcrQXVOW-9tGNkR583IpNIIBxEZU_6WGty0otjwrwKOn&s=10" alt="Logo" class="w-5 h-5 object-contain rounded-xs">
                <div>
                    <h1 class="font-bold text-slate-900 leading-none text-xs">🏠 Listing Jackson</h1>
                    <span class="text-[8px] font-semibold text-slate-500" x-text="isAdmin ? '⚡ Admin' : '👁️ Papar'"></span>
                </div>
            </div>
            <div class="flex gap-1">
                <template x-if="!isAdmin">
                    <button @click="isAdmin = true" class="bg-slate-900 text-white px-2 py-0.5 rounded text-[10px] font-semibold">🔑 Admin</button>
                </template>
                <template x-if="isAdmin">
                    <div class="flex gap-1">
                        <button @click="openAddModal = true" class="bg-blue-600 text-white px-2 py-0.5 rounded text-[10px] font-semibold">+ Tambah</button>
                        <button @click="isAdmin = false" class="bg-rose-600 text-white px-2 py-0.5 rounded text-[10px] font-semibold">👁️ Keluar</button>
                    </div>
                </template>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-1.5 space-y-1.5">
        <!-- Carian & Filter Mikro -->
        <div class="bg-white p-1.5 rounded shadow-2xs border border-slate-200 space-y-1">
            <input type="text" x-model="search" placeholder="🔍 Cari nama, owner, nota..." class="w-full px-2 py-1 bg-slate-50 border border-slate-200 rounded text-[11px] focus:outline-none focus:ring-1 focus:ring-blue-500">
            <div class="grid grid-cols-3 sm:grid-cols-6 gap-1">
                <select x-model="statusFilter" class="px-1 py-1 bg-slate-50 border border-slate-200 rounded text-[10px]">
                    <option value="">Status</option>
                    <option value="AVAILABLE">AVAILABLE</option>
                    <option value="SOLD">SOLD</option>
                </select>
                <select x-model="zoneFilter" class="px-1 py-1 bg-slate-50 border border-slate-200 rounded text-[10px]">
                    <option value="">Zon</option>
                    <option value="SDK">SDK</option>
                    <option value="KK">KK</option>
                    <option value="TWU">TWU</option>
                </select>
                <select x-model="forFilter" class="px-1 py-1 bg-slate-50 border border-slate-200 rounded text-[10px]">
                    <option value="">Urusan</option>
                    <option value="SELL">SELL</option>
                    <option value="RENT">RENT</option>
                </select>
                <select x-model="typeFilter" class="px-1 py-1 bg-slate-50 border border-slate-200 rounded text-[10px]">
                    <option value="">Jenis</option>
                    <option value="APT">APT</option>
                    <option value="LANDED">LANDED</option>
                    <option value="COMMERCIAL">COMMERCIAL</option>
                </select>
                <select x-model="ownerFilter" class="px-1 py-1 bg-slate-50 border border-slate-200 rounded text-[10px]">
                    <option value="">Owner</option>
                    <template x-for="own in uniqueOwners">
                        <option :value="own" x-text="own"></option>
                    </template>
                </select>
                <select x-model="sortBy" class="px-1 py-1 bg-slate-50 border border-slate-200 rounded text-[10px]">
                    <option value="name_asc">Nama (A-Z)</option>
                    <option value="name_desc">Nama (Z-A)</option>
                    <option value="price_asc">Harga ⬆</option>
                    <option value="price_desc">Harga ⬇</option>
                </select>
            </div>
        </div>

        <!-- Senarai Listing (Ultra-Compact Mobile Row) -->
        <div class="bg-white rounded shadow-2xs border border-slate-200 divide-y divide-slate-100 overflow-hidden">
            <template x-for="(item, id) in filteredProperties" :key="id">
                <div class="px-2 py-1.5 flex items-center justify-between gap-1.5 hover:bg-slate-50 transition">
                    <!-- Kiri: Badge & Nama Hartanah -->
                    <div class="flex items-center gap-1.5 min-w-0 flex-1">
                        <div class="flex flex-col gap-0.5 shrink-0">
                            <span class="px-1 py-0 text-[7px] font-bold rounded bg-indigo-50 text-indigo-600 uppercase text-center" x-text="item.ZONE"></span>
                            <span class="px-1 py-0 text-[7px] font-medium rounded bg-slate-100 text-slate-600 uppercase text-center" x-text="item.TYPE"></span>
                        </div>
                        <div class="min-w-0 flex-1">
                            <div class="flex items-center gap-1">
                                <span class="font-bold text-slate-900 truncate text-[11px] uppercase" x-text="item.PROPERTY"></span>
                                <span class="text-[8px] font-bold text-slate-400 shrink-0" x-text="'[' + item.FOR + ']'"></span>
                            </div>
                            <div class="flex items-center gap-1.5 text-[9px] text-slate-500 leading-tight">
                                <span class="truncate">Own: <strong class="text-slate-700" x-text="item.OWNER || '-'"></strong></span>
                                <template x-if="item.REMARK">
                                    <span class="text-amber-600 bg-amber-50 px-1 rounded truncate max-w-[120px]" x-text="item.REMARK"></span>
                                </template>
                            </div>
                        </div>
                    </div>

                    <!-- Kanan: Harga, Status & Aksi Ringkas -->
                    <div class="flex items-center gap-2 shrink-0 text-right">
                        <div>
                            <div class="font-bold text-blue-600 text-[11px] leading-tight" x-text="formatPrice(item.PRICE)"></div>
                            <div class="flex items-center justify-end gap-1">
                                <span :class="item.STATUS === 'AVAILABLE' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'" class="px-1 py-0 text-[7px] font-bold rounded uppercase" x-text="item.STATUS"></span>
                            </div>
                        </div>

                        <div class="flex items-center gap-1 border-l border-slate-100 pl-1.5">
                            <template x-if="item.URL">
                                <a :href="item.URL" target="_blank" class="text-blue-600 hover:text-blue-800 text-xs p-0.5" title="Pautan">🔗</a>
                            </template>
                            <template x-if="isAdmin">
                                <div class="flex gap-0.5">
                                    <button @click="editItem(id, item)" class="px-1 py-0.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded text-[9px] font-medium">Edit</button>
                                    <button @click="deleteItem(id)" class="px-1 py-0.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded text-[9px] font-medium">Padam</button>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </template>
            <template x-if="Object.keys(filteredProperties).length === 0">
                <div class="p-6 text-center text-slate-400 text-xs">
                    Tiada rekod hartanah ditemui.
                </div>
            </template>
        </div>

        <!-- MODAL TAMBAH / EDIT -->
        <div x-show="openAddModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-2 z-50" style="display: none;">
            <div @click.outside="closeModal()" class="bg-white rounded-lg max-w-md w-full p-3 shadow-xl border border-slate-100 space-y-2">
                <div class="flex justify-between items-center border-b pb-1">
                    <h3 class="font-bold text-slate-900 text-xs" x-text="editId ? 'Kemas Kini Listing' : 'Tambah Listing Baru'"></h3>
                    <button @click="closeModal()" class="text-slate-400 hover:text-slate-600 font-bold text-sm">&times;</button>
                </div>
                <form @submit.prevent="addItem" class="space-y-1.5">
                    <div>
                        <label class="block text-[9px] font-bold text-slate-500 uppercase mb-0.5">Nama Hartanah / Projek</label>
                        <input type="text" x-model="form.PROPERTY" @input="form.PROPERTY = form.PROPERTY.toUpperCase()" required placeholder="Cth: TAMAN INDAH JAYA" class="w-full px-2 py-1 border rounded text-xs outline-none focus:ring-1 focus:ring-blue-500 uppercase">
                    </div>
                    <div class="grid grid-cols-2 gap-1.5">
                        <div>
                            <label class="block text-[9px] font-bold text-slate-500 uppercase mb-0.5">Urusan</label>
                            <select x-model="form.FOR" class="w-full px-2 py-1 border rounded text-xs outline-none">
                                <option value="SELL">SELL</option>
                                <option value="RENT">RENT</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[9px] font-bold text-slate-500 uppercase mb-0.5">Jenis</label>
                            <select x-model="form.TYPE" class="w-full px-2 py-1 border rounded text-xs outline-none">
                                <option value="APT">APT</option>
                                <option value="LANDED">LANDED</option>
                                <option value="COMMERCIAL">COMMERCIAL</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-1.5">
                        <div>
                            <label class="block text-[9px] font-bold text-slate-500 uppercase mb-0.5">Owner / Agen</label>
                            <input type="text" x-model="form.OWNER" placeholder="Cth: JACKSON" class="w-full px-2 py-1 border rounded text-xs outline-none">
                        </div>
                        <div>
                            <label class="block text-[9px] font-bold text-slate-500 uppercase mb-0.5">Harga (RM)</label>
                            <input type="text" x-model="form.PRICE" placeholder="Cth: 310000" class="w-full px-2 py-1 border rounded text-xs outline-none">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-1.5">
                        <div>
                            <label class="block text-[9px] font-bold text-slate-500 uppercase mb-0.5">Zon</label>
                            <select x-model="form.ZONE" class="w-full px-2 py-1 border rounded text-xs outline-none">
                                <option value="SDK">SDK</option>
                                <option value="KK">KK</option>
                                <option value="TWU">TWU</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[9px] font-bold text-slate-500 uppercase mb-0.5">Status</label>
                            <select x-model="form.STATUS" class="w-full px-2 py-1 border rounded text-xs outline-none">
                                <option value="AVAILABLE">AVAILABLE</option>
                                <option value="SOLD">SOLD</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-[9px] font-bold text-slate-500 uppercase mb-0.5">Pautan URL</label>
                        <input type="url" x-model="form.URL" placeholder="https://..." class="w-full px-2 py-1 border rounded text-xs outline-none">
                    </div>
                    <div>
                        <label class="block text-[9px] font-bold text-slate-500 uppercase mb-0.5">Nota / Remark</label>
                        <input type="text" x-model="form.REMARK" placeholder="Cth: MV 320k" class="w-full px-2 py-1 border rounded text-xs outline-none">
                    </div>
                    <div class="flex gap-1.5 pt-1">
                        <button type="button" @click="closeModal()" class="w-1/2 py-1.5 border rounded text-xs font-semibold text-slate-600 bg-slate-50">Batal</button>
                        <button type="submit" class="w-1/2 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded text-xs font-semibold">Simpan</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCIB8qLZWjGVitHnJzS58BHPYoYdD_i7uM",
            authDomain: "listing-2a59c.firebaseapp.com",
            databaseURL: "https://jacksonlisting-5b878-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "listing-2a59c",
            storageBucket: "listing-2a59c.firebasestorage.app",
            messagingSenderId: "363739620416",
            appId: "1:363739620416:web:b14bd9043ac09a8032eba5",
            measurementId: "G-SZ47HNR9PT"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function disableShortcuts(e) {
            if (e.key === 'F12') return false;
            if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C', 'i', 'j', 'c'].includes(e.key)) return false;
            if (e.ctrlKey && ['u', 's', 'U', 'S'].includes(e.key)) return false;
            return true;
        }

        function propertyApp() {
            return {
                search: '',
                statusFilter: '',
                zoneFilter: '',
                forFilter: '',
                typeFilter: '',
                ownerFilter: '',
                sortBy: 'name_asc',
                openAddModal: false,
                isAdmin: false,
                properties: {},
                editId: null,
                form: {
                    PROPERTY: '', FOR: 'SELL', OWNER: '', PRICE: '', REMARK: '', STATUS: 'AVAILABLE', TYPE: 'APT', URL: '', ZONE: 'SDK'
                },
                init() {
                    db.ref('properties').on('value', snapshot => {
                        const data = snapshot.val();
                        this.properties = data || {};
                    });
                },
                formatPrice(val) {
                    if (!val) return 'RM 0';
                    let cleanNum = String(val).replace(/[^0-9.]/g, '');
                    let num = parseFloat(cleanNum);
                    if (isNaN(num)) return val;
                    return 'RM ' + num.toLocaleString('en-US', {maximumFractionDigits: 2});
                },
                get uniqueOwners() {
                    let owners = Object.values(this.properties).map(item => item.OWNER).filter(Boolean);
                    return [...new Set(owners)].sort();
                },
                get filteredProperties() {
                    let entries = Object.entries(this.properties);
                    let result = entries.filter(([id, item]) => {
                        const matchSearch = (item.PROPERTY + item.OWNER + item.ZONE + item.REMARK).toLowerCase().includes(this.search.toLowerCase());
                        const matchStatus = this.statusFilter === '' || item.STATUS === this.statusFilter;
                        const matchZone = this.zoneFilter === '' || item.ZONE === this.zoneFilter;
                        const matchFor = this.forFilter === '' || item.FOR === this.forFilter;
                        const matchType = this.typeFilter === '' || item.TYPE === this.typeFilter;
                        const matchOwner = this.ownerFilter === '' || item.OWNER === this.ownerFilter;
                        return matchSearch && matchStatus && matchZone && matchFor && matchType && matchOwner;
                    });

                    let mapped = result.map(([id, item]) => ({ id, ...item }));

                    return mapped.sort((a, b) => {
                        if (this.sortBy === 'name_asc') {
                            return a.PROPERTY.localeCompare(b.PROPERTY);
                        } else if (this.sortBy === 'name_desc') {
                            return b.PROPERTY.localeCompare(a.PROPERTY);
                        } else if (this.sortBy === 'price_asc' || this.sortBy === 'price_desc') {
                            let priceA = parseFloat(String(a.PRICE).replace(/[^0-9.]/g, '')) || 0;
                            let priceB = parseFloat(String(b.PRICE).replace(/[^0-9.]/g, '')) || 0;
                            return this.sortBy === 'price_asc' ? priceA - priceB : priceB - priceA;
                        }
                    }).reduce((acc, curr) => {
                        acc[curr.id] = curr;
                        return acc;
                    }, {});
                },
                editItem(id, item) {
                    if (!this.isAdmin) return;
                    this.editId = id;
                    this.form = { ...item };
                    this.openAddModal = true;
                },
                addItem() {
                    if (!this.isAdmin) return;
                    // Pastikan nama hartanah sentiasa huruf besar (uppercase)
                    if (this.form.PROPERTY) {
                        this.form.PROPERTY = this.form.PROPERTY.toUpperCase();
                    }
                    if (this.editId) {
                        db.ref('properties/' + this.editId).set(this.form);
                    } else {
                        db.ref('properties').push(this.form);
                    }
                    this.closeModal();
                },
                closeModal() {
                    this.openAddModal = false;
                    this.editId = null;
                    this.form = { PROPERTY: '', FOR: 'SELL', OWNER: '', PRICE: '', REMARK: '', STATUS: 'AVAILABLE', TYPE: 'APT', URL: '', ZONE: 'SDK' };
                },
                deleteItem(id) {
                    if (!this.isAdmin) return;
                    if (confirm('Padam listing ini?')) {
                        db.ref('properties/' + id).remove();
                    }
                }
            }
        }
    </script>
</body>
</html>
