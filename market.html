<!DOCTYPE html>
<html lang="ms">
<head>

  <style>

    .image-wrapper { position: relative; cursor: pointer; background: #ddd; }
    .property-image { width: 100%; height: 220px; object-fit: cover; display: block; background: #ddd; }
    .photo-badge { position: absolute; right: 10px; bottom: 10px; background: rgba(0,0,0,0.72); color: #fff; padding: 4px 9px; border-radius: 999px; font-size: 11px; font-weight: bold; }
    .gallery-trigger-badge { position: absolute; left: 10px; bottom: 10px; background: rgba(17,17,17,0.78); color: #fff; padding: 4px 9px; border-radius: 999px; font-size: 11px; font-weight: bold; }

    .top-admin-actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 15px; }
    .hidden { display: none !important; }
    .empty { text-align: center; padding: 50px 20px; color: #777; grid-column: 1 / -1; }
    .manage-title { margin-top: 30px; }
    #imageStatus { font-size: 13px; color: #666; margin-top: 4px; display: block; }
    #loadingScreen { text-align: center; padding: 20px; font-weight: bold; color: #555; }
    .attachment-preview { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .attachment-thumb { width: 68px; height: 52px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; cursor: pointer; }

    /* POPUP GALERI GAMBAR KIRI / KANAN */
    .gallery-modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92); z-index: 999; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 16px; }
    .gallery-header { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; color: #fff; gap: 12px; }
    .gallery-title { font-size: 15px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gallery-counter { font-size: 13px; color: #ccc; white-space: nowrap; }
    .gallery-close { background: rgba(255,255,255,0.16); color: #fff; border-radius: 8px; padding: 8px 14px; font-size: 16px; }
    .gallery-stage { position: relative; width: 100%; max-width: 900px; flex: 1; display: flex; align-items: center; justify-content: center; margin: 12px 0; min-height: 240px; }
    .gallery-main-img { max-width: 100%; max-height: 75vh; object-fit: contain; border-radius: 10px; background: #181818; }
    .gallery-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(17, 17, 17, 0.78); color: #fff; border: 1px solid rgba(255,255,255,0.25); width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; padding: 0; }
    .gallery-nav.prev { left: 10px; }
    .gallery-nav.next { right: 10px; }
    .gallery-thumbs { display: flex; gap: 8px; overflow-x: auto; max-width: 900px; padding-bottom: 4px; }
    .gallery-thumb { width: 58px; height: 44px; object-fit: cover; border-radius: 6px; opacity: 0.55; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; }
    .gallery-thumb.active { opacity: 1; border-color: #25D366; }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-content">
    <div class="brand-wrapper">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR9sKS7o8ocx7jnNJ5DA-_CZv1c356r_iMwID9sfySZKw&s=10" alt="Jackson Property Logo" class="property-logo">

    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ0WMTAjKCx3_U3vBwRFfCmQKIE-6eJd8BqxUR2aBWdcg&s=10" alt="Admin" class="admin-photo" onclick="openAdmin()">
  </div>
</header>

<!-- PUBLIC PAGE -->
<main id="publicPage">
  <div class="container">
    <div class="zone-buttons">
      <button class="zone-button active" onclick="changeZone('ALL', this)">Semua Zone</button>
      <button class="zone-button" onclick="changeZone('Sandakan', this)">Sandakan</button>

<!-- ADMIN PAGE -->
<main id="adminPage">
  <div id="loadingScreen">Memeriksa sesi log masuk...</div>

  <!-- LOGIN SECTION -->
  <div id="loginSection" class="panel login-panel hidden">

  <!-- PORTAL / DASHBOARD SECTION -->
  <div id="portalSection" class="container hidden">
    <div class="panel">
      <div class="top-admin-actions">
        <h2 id="formTitle">➕ Tambah Property</h2>

          <button onclick="backToWebsite()">Website</button>
          <button class="logout-button" onclick="logout()">Log Keluar</button>
        </div>
      </div>
      <label>Zone</label>
      <select id="propertyZone">
        <option value="Sandakan" selected>Sandakan</option>
        <option value="Kota Kinabalu">Kota Kinabalu</option>
        <option value="Tawau">Tawau</option>
      </select>
      <label>Gambar Property (Fail - Boleh pilih banyak gambar sekaligus -> Auto Upload ke ImgBB)</label>
      <input type="file" id="propertyImageFile" accept="image/*" multiple>
      <span id="imageStatus"></span>

      <label>Description Pendek</label>

        <option value="Booked">Booked</option>

      </select>
      <button type="button" id="publishBtn" class="publish-button" onclick="saveProperty()">🚀 PUBLISH PROPERTY</button>
      <button type="button" id="cancelEditButton" class="cancel-button hidden" onclick="cancelEdit()">Cancel Edit</button>

<!-- POPUP GALERI GAMBAR (KIRI / KANAN) -->
<div id="galleryModal" class="gallery-modal hidden" onclick="handleGalleryBackdropClick(event)">
  <div class="gallery-header">
    <div class="gallery-title" id="galleryTitle">Galeri Gambar</div>
    <div class="gallery-counter" id="galleryCounter">1 / 1</div>
    <button type="button" class="gallery-close" onclick="closeGallery()">&times;</button>
  </div>

  <div class="gallery-stage">
    <button type="button" class="gallery-nav prev" id="galleryPrevBtn" onclick="prevGalleryImage()" aria-label="Gambar Sebelumnya">&#10094;</button>
    <img id="galleryMainImage" class="gallery-main-img" src="" alt="Gambar Property" onerror="this.onerror=null;this.src='https://placehold.co/800x500?text=Property+Photo';">
    <button type="button" class="gallery-nav next" id="galleryNextBtn" onclick="nextGalleryImage()" aria-label="Gambar Seterusnya">&#10095;</button>
  </div>

  <div class="gallery-thumbs" id="galleryThumbs"></div>
</div>

<script>
/* =========================================
   SETTINGS & FIREBASE CONFIG
========================================= */
const WHATSAPP_NUMBER = "60138885020";
const IMGBB_API_KEY = "6c2f224bc6526cb2c326211aa6439e76";
const FALLBACK_IMAGE = "https://placehold.co/800x500?text=Property+Photo";

const firebaseConfig = {
    apiKey: "AIzaSyCIB8qLZWjGVitHnJzS58BHPYoYdD_i7uM",
    authDomain: "listing-2a59c.firebaseapp.com",
    databaseURL: "https://jacksonlisting-5b878-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "listing-2a59c",
    storageBucket: "listing-2a59c.firebasestorage.app",
    messagingSenderId: "363739620416",
    appId: "1:363739620416:web:b14bd9043ac09a8032eba5",
    measurementId: "G-SZ47HNR9PT"
};

const marketApp = firebase.apps.find(app => app.name === "MARKET_APP")
  || firebase.initializeApp(firebaseConfig, "MARKET_APP");
const auth = marketApp.auth();
const rtdb = marketApp.database();

let selectedZone = "ALL";
let editingId = null;
let currentImageUrl = FALLBACK_IMAGE;
let currentAttachments = [];
let properties = [];

// Keadaan galeri popup
let galleryImages = [];
let galleryIndex = 0;

/* =========================================
   NORMALISASI DATA & KUMPUL GAMBAR / LINK
========================================= */
function normalizeZone(zoneVal) {
  const z = String(zoneVal || "").trim().toUpperCase();
  if (z === "SDK" || z.includes("SANDAKAN")) return "Sandakan";
  if (z === "KK" || z.includes("KOTA KINABALU")) return "Kota Kinabalu";
  if (z === "TWU" || z.includes("TAWAU")) return "Tawau";
  return zoneVal || "Sandakan";
}

function normalizeStatus(statusVal) {
  const s = String(statusVal || "Available").trim().toUpperCase();
  if (s === "AVAILABLE") return "Available";
  if (s === "BOOKED") return "Booked";
  if (s === "SOLD") return "Sold";
  return statusVal || "Available";
}

function splitUrlLinks(rawVal) {
  if (!rawVal) return [];
  if (Array.isArray(rawVal)) {
    return rawVal.flatMap(entry => splitUrlLinks(entry));
  }
  if (typeof rawVal === "object" && rawVal.url) {
    return splitUrlLinks(rawVal.url);
  }
  return String(rawVal)
    .split(/[\s,\n;|]+/)
    .map(u => u.trim())
    .filter(u => /^https?:\/\//i.test(u) || u.startsWith("data:image/"));
}

function isMarketplaceItemPage(url) {
  return /facebook\.com\/marketplace\/item\//i.test(url);
}

function isImageUrl(url) {
  if (!url) return false;
  if (url.startsWith("data:image/")) return true;
  if (isMarketplaceItemPage(url)) return false;
  return /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(url)
    || /fbcdn\.net|scontent|ibb\.co|imgbb\.com|placehold\.co/i.test(url);
}

function isImgBBUrl(url) {
  return /i\.ibb\.co|ibb\.co|imgbb\.com/i.test(String(url || ""));
}

function extractListingLink(item) {
  const candidates = [
    item.LINK, item.link, item.listingUrl, item.listing_url,
    item.URL, item.url, item.image
  ];
  for (const raw of candidates) {
    const links = splitUrlLinks(raw);
    for (const link of links) {
      if (/^https?:\/\//i.test(link) && (isMarketplaceItemPage(link) || !isImageUrl(link))) {
        return link;
      }
    }
  }
  return "";
}

function collectImagesFromListing(item) {
  const collected = [];

  if (Array.isArray(item.IMAGES)) {
    for (const imgEntry of item.IMAGES) {
      const candidate = typeof imgEntry === "string" ? imgEntry : (imgEntry && imgEntry.url);
      for (const link of splitUrlLinks(candidate)) {
        if (isImageUrl(link) && !collected.includes(link)) {
          collected.push(link);
        }
      }
    }
  }

  const linkUrls = [...splitUrlLinks(item.URL), ...splitUrlLinks(item.url), ...splitUrlLinks(item.image)];
  for (const link of linkUrls) {
    if (isImageUrl(link) && !collected.includes(link)) {
      collected.push(link);
    }
  }

  if (collected.length === 0) {
    collected.push(FALLBACK_IMAGE);
  }

  return collected;
}

function mapListingRecord(id, item) {
  const metaParts = [
    item.FOR ? `[${item.FOR}]` : "",
    item.TYPE || "",
    item.LOT || ""
  ].filter(Boolean).join(" • ");

  const remarkText = item.REMARK || item.description || "";
  const combinedDesc = metaParts && remarkText
    ? `${metaParts}\n${remarkText}`
    : (remarkText || metaParts);

  const images = collectImagesFromListing(item);
  const listingLink = extractListingLink(item);

  return {
    id,
    zone: normalizeZone(item.ZONE || item.zone),
    image: images[0],
    images,
    listingLink,
    name: String(item.PROPERTY || item.name || "PROPERTY").toUpperCase(),
    price: Number(String(item.PRICE ?? item.price ?? 0).replace(/[^0-9.]/g, "")) || 0,
    location: item.location || item.ZONE || "Sabah",
    description: combinedDesc,
    status: normalizeStatus(item.STATUS || item.status),
    createdAt: item.createdAt || 0,
    _raw: item
  };
}

/* =========================================
   BUKA LINK LISTING / VIEW PHOTO
========================================= */
function handlePropertyPhotoClick(propertyId) {
  const prop = properties.find(p => p.id === propertyId);
  if (!prop) return;

  if (prop.listingLink && /^https?:\/\//i.test(prop.listingLink)) {
    window.open(prop.listingLink, "_blank", "noopener,noreferrer");
    return;
  }

  openGalleryById(propertyId);
}

/* =========================================
   POPUP GALERI GAMBAR (VIEW PHOTO KIRI / KANAN)
========================================= */
function openGalleryById(propertyId, event) {
  if (event) event.stopPropagation();
  const prop = properties.find(p => p.id === propertyId);
  const imgs = (prop && Array.isArray(prop.images) && prop.images.length > 0)
    ? prop.images
    : [FALLBACK_IMAGE];

  galleryImages = imgs;
  galleryIndex = 0;
  document.getElementById("galleryTitle").innerText = prop ? prop.name : "Galeri Gambar";
  document.getElementById("galleryModal").classList.remove("hidden");
  renderGalleryState();
}

function openGalleryFromUrls(title, urls) {
  const validUrls = (urls || []).filter(u => u && u !== FALLBACK_IMAGE);
  galleryImages = validUrls.length > 0 ? validUrls : [FALLBACK_IMAGE];
  galleryIndex = 0;
  document.getElementById("galleryTitle").innerText = title || "Attachment Preview";
  document.getElementById("galleryModal").classList.remove("hidden");
  renderGalleryState();
}

function renderGalleryState() {
  const total = galleryImages.length;
  if (total === 0) return;

  galleryIndex = ((galleryIndex % total) + total) % total;
  const currentUrl = galleryImages[galleryIndex];

  const mainImg = document.getElementById("galleryMainImage");
  mainImg.src = currentUrl;
  document.getElementById("galleryCounter").innerText = `${galleryIndex + 1} / ${total}`;

  const showNav = total > 1;
  document.getElementById("galleryPrevBtn").classList.toggle("hidden", !showNav);
  document.getElementById("galleryNextBtn").classList.toggle("hidden", !showNav);

  const thumbsEl = document.getElementById("galleryThumbs");
  thumbsEl.innerHTML = galleryImages.map((url, idx) => `
    <img
      src="${escapeHTML(url)}"
      alt="Thumbnail ${idx + 1}"
      class="gallery-thumb ${idx === galleryIndex ? "active" : ""}"
      onclick="selectGalleryIndex(${idx})"
      onerror="this.onerror=null;this.src='${FALLBACK_IMAGE}';"
    >
  `).join("");
}

function selectGalleryIndex(idx) {
  galleryIndex = idx;
  renderGalleryState();
}

function prevGalleryImage() {
  if (galleryImages.length <= 1) return;
  galleryIndex = (galleryIndex - 1 + galleryImages.length) % galleryImages.length;
  renderGalleryState();
}

function nextGalleryImage() {
  if (galleryImages.length <= 1) return;
  galleryIndex = (galleryIndex + 1) % galleryImages.length;
  renderGalleryState();
}

function closeGallery() {
  document.getElementById("galleryModal").classList.add("hidden");
}

function handleGalleryBackdropClick(event) {
  if (event.target.id === "galleryModal") {
    closeGallery();
  }
}

document.addEventListener("keydown", (e) => {
  const modal = document.getElementById("galleryModal");
  if (modal.classList.contains("hidden")) return;
  if (e.key === "Escape") closeGallery();
  if (e.key === "ArrowLeft") prevGalleryImage();
  if (e.key === "ArrowRight") nextGalleryImage();
});

/* =========================================
   FIREBASE AUTH STATE & LOGIN
========================================= */
auth.onAuthStateChanged((user) => {
  document.getElementById("loadingScreen").style.display = "none";
  if (user) {
    sessionStorage.setItem("jackson_market_logged_in", "true");
    document.getElementById("loginSection").classList.add("hidden");
    document.getElementById("portalSection").classList.remove("hidden");
    loadPropertiesFromFirebase();
  } else {
    sessionStorage.removeItem("jackson_market_logged_in");
    document.getElementById("portalSection").classList.add("hidden");
    document.getElementById("loginSection").classList.remove("hidden");
  }
});

function login() {
  const email = document.getElementById("adminEmail").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    alert("Sila masukkan e-mel dan password.");
    return;
  }

  auth.signInWithEmailAndPassword(email, password)
    .then(() => {
      document.getElementById("adminEmail").value = "";
      document.getElementById("password").value = "";
    })
    .catch((error) => {
      alert("Log masuk gagal. E-mel atau password salah.");
      console.error(error.message);
    });
}

function logout() {
  auth.signOut().then(() => {
    alert("Anda telah berjaya log keluar.");
    backToWebsite();
  });
}

/* =========================================
   AUTO LIVE SYNC DARI LISTING (REALTIME DB)
========================================= */
let isListeningRtdb = false;

function subscribeListingsRealtime({ includeAdmin = false } = {}) {
  if (!isListeningRtdb) {
    isListeningRtdb = true;
    const listEl = document.getElementById("propertyList");

    rtdb.ref("properties").on("value", (snapshot) => {
      const raw = snapshot.val();
      if (!raw || typeof raw !== "object") {
        properties = [];
      } else {
        properties = Object.entries(raw)
          .map(([id, item]) => mapListingRecord(id, item || {}))
          .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      }

      renderPublicListings();
      if (!document.getElementById("portalSection").classList.contains("hidden")) {
        renderManageListings();
      }
    }, (error) => {
      console.error("Ralat membaca Realtime DB:", error);
      if (listEl) {
        listEl.innerHTML = `<div class="empty">Gagal memuatkan senarai listing: ${escapeHTML(error.message)}</div>`;
      }
    });
  } else if (includeAdmin) {
    renderManageListings();
  }
}

function loadPropertiesFromFirebase() {
  subscribeListingsRealtime({ includeAdmin: true });
}

function loadPublicProperties() {
  subscribeListingsRealtime({ includeAdmin: false });
}

/* =========================================
   HELPERS & FORMATTING
========================================= */
function formatPrice(price) {
  const number = String(price).replace(/[^0-9]/g, "");
  if (!number) return "RM0";
  return "RM" + Number(number).toLocaleString("en-MY");
}

function changeZone(zone, button) {
  selectedZone = zone;
  document.querySelectorAll(".zone-button").forEach(item => item.classList.remove("active"));

  document.getElementById("zoneTitle").innerText = zone === "ALL"

}

function getStatusClass(status) {
  if (status === "Available") return "available";
  if (status === "Booked") return "booked";
  return "sold";
}

function escapeHTML(text) {
  return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function renderAttachmentPreview() {
  const previewEl = document.getElementById("attachmentPreview");
  if (!previewEl) return;

  const validImgs = (currentAttachments || []).filter(u => u && u !== FALLBACK_IMAGE);
  if (validImgs.length === 0) {
    previewEl.innerHTML = "";
    return;
  }

  previewEl.innerHTML = validImgs.map((url, idx) => {
    const safeUrl = escapeHTML(url);
    return `<img src="${safeUrl}" alt="Attachment ${idx + 1}" title="Klik untuk view attachment" class="attachment-thumb" data-idx="${idx}" onclick="openGalleryFromUrls('Attachment Listing (${validImgs.length})', currentAttachments)" onerror="this.onerror=null;this.src='${FALLBACK_IMAGE}';">`;
  }).join("");
}

/* =========================================
   FUNGSI TUKAR FILE / LINK KEPADA BASE64 & AUTO UPLOAD IMGBB
========================================= */
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => {
      const res = String(reader.result || "");
      resolve(res.includes(",") ? res.split(",")[1] : res);
    };
    reader.onerror = error => reject(error);
  });
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(blob);
    reader.onload = () => {
      const res = String(reader.result || "");
      resolve(res.includes(",") ? res.split(",")[1] : res);
    };
    reader.onerror = error => reject(error);
  });
}

async function uploadBase64ToImgBB(base64Image) {
  const formData = new FormData();
  formData.append("key", IMGBB_API_KEY);
  formData.append("image", base64Image);

  const response = await fetch("https://api.imgbb.com/1/upload", {
    method: "POST",
    body: formData
  });

  const result = await response.json();
  if (result && result.success && result.data && result.data.url) {
    return result.data.url;
  }
  throw new Error("Gagal upload ke ImgBB. Sila semak API Key anda.");
}

async function uploadSingleToImgBB(file) {
  const base64Image = await fileToBase64(file);
  return uploadBase64ToImgBB(base64Image);
}

async function uploadImageUrlToImgBB(imageUrl) {
  if (!imageUrl || imageUrl === FALLBACK_IMAGE) return null;
  if (isImgBBUrl(imageUrl)) return imageUrl;

  if (imageUrl.startsWith("data:image/")) {
    const base64Part = imageUrl.split(",")[1];
    return base64Part ? uploadBase64ToImgBB(base64Part) : imageUrl;
  }

  try {
    const res = await fetch(imageUrl, { mode: "cors" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const blob = await res.blob();
    if (!blob || !blob.type.startsWith("image/")) {
      throw new Error("Bukan fail gambar");
    }
    const base64Data = await blobToBase64(blob);
    return await uploadBase64ToImgBB(base64Data);
  } catch (err) {
    console.warn("Tidak dapat fetch terus link gambar ke ImgBB (kemungkinan CORS), simpan link asal sebagai lampiran:", imageUrl, err);
    return imageUrl;
  }
}

document.getElementById("propertyImageFile").addEventListener("change", function(event) {
  const count = event.target.files ? event.target.files.length : 0;

});

/* =========================================
   SAVE / UPDATE PROPERTY (REALTIME DB + IMGBB)
========================================= */
async function saveProperty() {
  const publishBtn = document.getElementById("publishBtn") || document.querySelector(".publish-button");
  const zone = (document.getElementById("propertyZone")?.value || "Sandakan").trim();
  const rawImageLinks = (document.getElementById("propertyImageLinks")?.value || "").trim();
  const listingLinkInput = (document.getElementById("propertyListingLink")?.value || "").trim();
  const name = (document.getElementById("propertyName")?.value || "").trim().toUpperCase();
  const price = (document.getElementById("propertyPrice")?.value || "").replace(/[^0-9]/g, "");
  const location = (document.getElementById("propertyLocation")?.value || "").trim();
  const description = (document.getElementById("propertyDescription")?.value || "").trim();
  const status = (document.getElementById("propertyStatus")?.value || "Available").trim();
  const imageFileInput = document.getElementById("propertyImageFile");

  if (!name || !price || !location) {
    alert("Sila isi Nama Property, Harga dan Lokasi.");
    return;
  }

  if (publishBtn) {
    publishBtn.disabled = true;
    publishBtn.innerText = "⏳ Sedang memproses...";
  }

  try {
    const parsedLinks = splitUrlLinks(rawImageLinks);
    const imageLinkCandidates = parsedLinks.filter(u => !isMarketplaceItemPage(u));
    const detectedMarketplaceLink = parsedLinks.find(u => isMarketplaceItemPage(u)) || "";
    const listingLink = listingLinkInput || detectedMarketplaceLink;

    let uploadedUrls = [];

    const files = imageFileInput && imageFileInput.files ? Array.from(imageFileInput.files) : [];
    if (files.length > 0) {
      if (publishBtn) publishBtn.innerText = `⏳ Sedang upload ${files.length} fail gambar ke ImgBB...`;
      const fileUploads = await Promise.all(files.map(file => uploadSingleToImgBB(file)));
      uploadedUrls.push(...fileUploads);
    }

    if (imageLinkCandidates.length > 0) {
      if (publishBtn) publishBtn.innerText = `⏳ Sedang upload ${imageLinkCandidates.length} link gambar ke ImgBB...`;
      const linkUploads = await Promise.all(imageLinkCandidates.map(link => uploadImageUrlToImgBB(link)));
      uploadedUrls.push(...linkUploads.filter(Boolean));
    }

    if (publishBtn) publishBtn.innerText = "⏳ Sedang simpan ke Database...";

    const zoneCode = zone === "Kota Kinabalu" ? "KK" : (zone === "Tawau" ? "TWU" : "SDK");
    const existingRaw = editingId ? (properties.find(p => p.id === editingId)?._raw || {}) : {};
    const existingImageUrls = Array.isArray(existingRaw.IMAGES)
      ? existingRaw.IMAGES.map(img => typeof img === "string" ? img : img?.url).filter(u => isImageUrl(u) && u !== FALLBACK_IMAGE)
      : [];

    const finalImageUrls = uploadedUrls.length > 0
      ? [...new Set([...uploadedUrls, ...existingImageUrls])]
      : (existingImageUrls.length > 0 ? existingImageUrls : [currentImageUrl || FALLBACK_IMAGE]);

    const updatedImages = finalImageUrls.map(url => ({ url, path: "" }));
    const resolvedListingLink = listingLink || extractListingLink(existingRaw);
    const combinedUrlField = [
      resolvedListingLink,
      ...finalImageUrls.filter(u => u !== FALLBACK_IMAGE)
    ].filter(Boolean).join(" ");

    const listingPayload = {
      ...existingRaw,
      PROPERTY: name,
      ZONE: zoneCode,
      FOR: existingRaw.FOR || "SELL",
      TYPE: existingRaw.TYPE || "LANDED",
      LOT: existingRaw.LOT || "INTERMEDIATE",
      PRICE: Number(price),
      location: location,
      REMARK: description,
      STATUS: status.toUpperCase(),
      LINK: resolvedListingLink,
      URL: combinedUrlField,
      IMAGES: updatedImages,
      createdAt: existingRaw.createdAt || Date.now()
    };

    if (editingId !== null) {
      await rtdb.ref("properties/" + editingId).update(listingPayload);
      alert("Property berjaya dikemas kini!");
    } else {
      await rtdb.ref("properties").push(listingPayload);
      alert("Property berjaya dipublish!");
    }

    cancelEdit();
  } catch (error) {
    console.error("Ralat saveProperty:", error);
    alert("Gagal publish property: " + (error && error.message ? error.message : "Ralat tidak diketahui"));
  } finally {
    if (publishBtn) {
      publishBtn.innerText = "🚀 PUBLISH PROPERTY";
      publishBtn.disabled = false;
    }
  }
}

  }

    return `

        ${imgCount > 1 ? `<span class="photo-badge">📷 ${imgCount}</span>` : `<span class="photo-badge">🔍 Lihat</span>`}

      <div class="property-content">
        <span class="status ${getStatusClass(property.status)}">${escapeHTML(property.status)}</span>
        <h3 class="property-name">${escapeHTML(property.name)}</h3>
        <div class="price">${formatPrice(property.price)}</div>
        <div class="location">📍 ${escapeHTML(property.location)}</div>
        <p class="description">Zone: <b>${escapeHTML(property.zone)}</b></p>
        <button type="button" class="edit-button" onclick="editProperty('${property.id}')">EDIT</button>
        <button type="button" class="delete-button" onclick="deleteProperty('${property.id}')">DELETE</button>
      </div>

  }).join("");
}

function editProperty(id) {
  const property = properties.find(item => item.id === id);
  if (!property) return;

  editingId = id;
  currentImageUrl = property.image;
  currentAttachments = Array.isArray(property.images) ? [...property.images] : [property.image];

  document.getElementById("propertyZone").value = property.zone;
  document.getElementById("propertyListingLink").value = property.listingLink || "";
  document.getElementById("propertyImageLinks").value = "";
  document.getElementById("propertyName").value = property.name;
  document.getElementById("propertyPrice").value = property.price;
  document.getElementById("propertyLocation").value = property.location;
  document.getElementById("propertyDescription").value = property._raw?.REMARK ?? property.description;
  document.getElementById("propertyStatus").value = property.status;
  document.getElementById("propertyImageFile").value = "";
  document.getElementById("imageStatus").innerText = "Tambah link gambar baru atau pilih fail untuk auto upload ke ImgBB sebagai lampiran.";
  renderAttachmentPreview();

  document.getElementById("formTitle").innerText = "✏️ Edit Property";
  document.getElementById("cancelEditButton").classList.remove("hidden");
  window.scrollTo(0, 0);
}

function cancelEdit() {
  editingId = null;
  currentImageUrl = FALLBACK_IMAGE;
  currentAttachments = [];
  document.getElementById("formTitle").innerText = "➕ Tambah Property";
  document.getElementById("cancelEditButton").classList.add("hidden");
  document.getElementById("propertyZone").value = "Sandakan";
  document.getElementById("propertyImageFile").value = "";
  document.getElementById("propertyImageLinks").value = "";
  document.getElementById("propertyListingLink").value = "";
  document.getElementById("propertyName").value = "";
  document.getElementById("propertyPrice").value = "";
  document.getElementById("propertyLocation").value = "";
  document.getElementById("propertyDescription").value = "";
  document.getElementById("propertyStatus").value = "Available";
  document.getElementById("imageStatus").innerText = "";
  renderAttachmentPreview();
}

async function deleteProperty(id) {
  if (!confirm("Adakah anda pasti mahu delete property ini?")) return;
  try {
    await rtdb.ref("properties/" + id).remove();
    alert("Property telah dipadam.");
  } catch (error) {
    console.error("Ralat memadam:", error);
    alert("Gagal memadam property.");
  }
}
