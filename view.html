<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paparan Listing Hartanah Sabah</title>
    <link rel="icon" type="image/png" href="jack.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-8 select-none text-[10px]" x-data="publicPropertyApp()">
    
    <div class="max-w-md mx-auto p-2 space-y-1.5">

        <!-- Header Ringkas -->
        <header class="bg-white border border-slate-200 px-2.5 py-1.5 rounded-md shadow-2xs flex justify-between items-center">
            <div class="flex items-center gap-1.5">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQh4BKiyvgK3c6XwcrQXVOW-9tGNkR583IpNIIBxEZU_6WGty0otjwrwKOn&s=10" alt="Logo" class="w-5 h-5 object-contain rounded-xs">
                <div>
                    <h1 class="font-bold text-slate-900 leading-tight text-[11px]">🏠 Listing Jackson (Viewer)</h1>
                    <span class="text-[8px] font-semibold text-emerald-600">👀 Mod Paparan & Status</span>
                </div>
            </div>
            <div class="text-[8px] text-slate-500 font-bold tracking-tight text-right">
                SABAH MABUK HARTANAH
            </div>
        </header>

        <!-- Carian & Filter Mikro (Padat) -->
        <div class="bg-white p-1.5 rounded-md shadow-2xs border border-slate-200 space-y-1">
            <div class="relative">
                <input type="text" x-model="search" placeholder="🔍 Cari nama, owner, nota..." class="w-full px-2 py-1 pr-6 bg-slate-50 border border-slate-200 rounded text-[10px] focus:outline-none focus:ring-1 focus:ring-blue-500">
                <template x-if="search">
                    <button @click="search = ''" class="absolute right-1.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 font-bold text-xs px-1" title="Padam carian">&times;</button>
                </template>
            </div>
            
            <div class="grid grid-cols-6 gap-1">
                <select x-model="statusFilter" class="px-1 py-1 bg-slate-50 border border-slate-200 rounded text-[9px]">
                    <option value="">Status</option>
                    <option value="AVAILABLE">AVAILABLE</option>
                    <option value="BOOKED">BOOKED</option>
                    <option value="SOLD">SOLD</option>
                    <option value="HOLD">HOLD</option>
                </select>
                <select x-model="zoneFilter" class="px-1 py-1 bg-slate-50 border border-slate-200 rounded text-[9px]">
                    <option value="">Zon</option>
                    <option value="SDK">SDK</option>
                    <option value="KK">KK</option>
                    <option value="TWU">TWU</option>
                    <option value="LDU">LDU</option>
                    <option value="SPA">SPA</option>
                    <option value="RNU">RNU</option>
                </select>
                <select x-model="forFilter" class="px-1 py-1 bg-slate-50 border border-slate-200 rounded text-[9px]">
                    <option value="">Urusan</option>
                    <option value="SELL">SELL</option>
                    <option value="RENT">RENT</option>
                </select>
                <select x-model="typeFilter" class="px-1 py-1 bg-slate-50 border border-slate-200 rounded text-[9px]">
                    <option value="">Jenis</option>
                    <option value="APT">APT</option>
                    <option value="LANDED">LANDED</option>
                    <option value="COMMERCIAL">COMMERCIAL</option>
                </select>
                <select x-model="ownerFilter" class="px-1 py-1 bg-slate-50 border border-slate-200 rounded text-[9px]">
                    <option value="">Owner</option>
                    <template x-for="own in uniqueOwners">
                        <option :value="own" x-text="own"></option>
                    </template>
                </select>
                <select x-model="sortBy" class="px-1 py-1 bg-slate-50 border border-slate-200 rounded text-[9px]">
                    <option value="latest">Terkini</option>
                    <option value="name_asc">A-Z</option>
                    <option value="price_asc">Harga ⬆</option>
                    <option value="price_desc">Harga ⬇</option>
                </select>
            </div>
        </div>

        <!-- Senarai Tepat 13 Listing Per Page -->
        <div class="space-y-1">
            <template x-for="(item, id) in filteredProperties" :key="id">
                <div @click="showDetail(item)" class="bg-white px-2 py-1.5 rounded shadow-2xs border border-slate-200 hover:border-blue-300 transition cursor-pointer flex items-center justify-between gap-2">
                    
                    <!-- Kiri: Info Ringkas -->
                    <div class="min-w-0 flex-1">
                        <div class="flex items-center gap-1">
                            <span class="px-1 py-0.2 text-[7px] font-bold rounded bg-indigo-50 text-indigo-600 uppercase" x-text="item.ZONE"></span>
                            <span class="px-1 py-0.2 text-[7px] font-medium rounded bg-slate-100 text-slate-600 uppercase" x-text="item.TYPE"></span>
                            <span class="px-1 py-0.2 text-[7px] font-bold rounded bg-blue-50 text-blue-600 uppercase" x-text="item.FOR"></span>
                            <h2 class="font-bold text-slate-900 text-[10px] uppercase truncate" x-text="item.PROPERTY"></h2>
                        </div>
                        <div class="text-[9px] text-slate-500 truncate mt-0.5">
                            Owner: <span class="text-slate-700 font-medium" x-text="item.OWNER || '-'"></span>
                            <template x-if="item.REMARK">
                                <span class="text-amber-700 ml-1">| Nota: <span x-text="item.REMARK"></span></span>
                            </template>
                        </div>
                    </div>

                    <!-- Kanan: Harga & Status -->
                    <div class="flex items-center gap-2 shrink-0">
                        <div class="font-bold text-blue-600 text-[10px]" x-text="formatPrice(item.PRICE)"></div>
                        
                        <template x-if="item.URL">
                            <a :href="item.URL" target="_blank" class="text-blue-600 hover:text-blue-800 text-[9px] px-1 py-0.5 bg-blue-50 rounded" @click.stop title="Pautan">🔗</a>
                        </template>

                        <div @click.stop>
                            <select @change="updateStatus(id, $event.target.value)" 
                                :class="item.STATUS === 'AVAILABLE' ? 'bg-emerald-100 text-emerald-700 border-emerald-300' : (item.STATUS === 'BOOKED' ? 'bg-amber-100 text-amber-700 border-amber-300' : 'bg-rose-100 text-rose-700 border-rose-300')" 
                                class="px-1.5 py-0.5 text-[8px] font-bold rounded uppercase border cursor-pointer outline-none shadow-2xs">
                                <option value="AVAILABLE" :selected="item.STATUS === 'AVAILABLE'">AVAIL</option>
                                <option value="BOOKED" :selected="item.STATUS === 'BOOKED'">BOOKED</option>
                                <option value="SOLD" :selected="item.STATUS === 'SOLD'">SOLD</option>
                                <option value="HOLD" :selected="item.STATUS === 'HOLD'">HOLD</option>
                            </select>
                        </div>
                    </div>

                </div>
            </template>
            
            <template x-if="Object.keys(filteredProperties).length === 0">
                <div class="bg-white p-6 rounded text-center text-slate-400 text-xs border border-slate-200">
                    Tiada rekod hartanah ditemui.
                </div>
            </template>
        </div>

        <!-- 📄 NAVIGASI PAGINATION (Sentiasa Kelihatan Tanpa Isu Sembunyi) -->
        <div class="flex justify-between items-center bg-white px-3 py-2 rounded-md shadow-2xs border border-slate-200 text-[10px]">
            <button @click="currentPage > 1 ? currentPage-- : null" :class="currentPage === 1 ? 'opacity-40 cursor-not-allowed' : 'hover:bg-slate-100'" class="px-2.5 py-1.5 border rounded bg-slate-50 font-semibold text-slate-700">
                ⬅ Sebelumnya
            </button>
            
            <span class="text-slate-600 font-medium">
                Hal <strong class="text-slate-900" x-text="currentPage"></strong> / <strong class="text-slate-900" x-text="totalPages"></strong> 
                (<span x-text="totalFilteredCount"></span> item)
            </span>

            <button @click="currentPage < totalPages ? currentPage++ : null" :class="currentPage === totalPages ? 'opacity-40 cursor-not-allowed' : 'hover:bg-slate-100'" class="px-2.5 py-1.5 border rounded bg-slate-50 font-semibold text-slate-700">
                Seterusnya ➡
            </button>
        </div>

        <!-- MODAL DETAIL / NOTA -->
        <div x-show="selectedItem" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-3 z-50" style="display: none;" @click.self="closeDetail()">
            <div class="bg-white rounded-xl max-w-sm w-full p-3.5 shadow-2xl border border-slate-100 space-y-2.5 max-h-[85vh] flex flex-col text-[11px]">
                
                <div class="flex justify-between items-start border-b pb-1.5 gap-2">
                    <h3 class="font-bold text-slate-900 text-xs uppercase leading-snug break-words" x-text="selectedItem?.PROPERTY"></h3>
                    <button @click="closeDetail()" class="text-slate-400 hover:text-slate-600 font-bold text-base px-1 leading-none">&times;</button>
                </div>

                <div class="space-y-1.5 text-slate-700 overflow-y-auto pr-1">
                    <div class="flex justify-between border-b border-slate-100 pb-1">
                        <span class="text-slate-500">Urusan / Jenis:</span>
                        <span class="font-bold uppercase" x-text="(selectedItem?.FOR || '-') + ' / ' + (selectedItem?.TYPE || '-')"></span>
                    </div>
                    <div class="flex justify-between border-b border-slate-100 pb-1">
                        <span class="text-slate-500">Zon:</span>
                        <span class="font-bold uppercase" x-text="selectedItem?.ZONE || '-'"></span>
                    </div>
                    <div class="flex justify-between border-b border-slate-100 pb-1">
                        <span class="text-slate-500">Owner / Agen:</span>
                        <span class="font-bold uppercase" x-text="selectedItem?.OWNER || '-'"></span>
                    </div>
                    <div class="flex justify-between border-b border-slate-100 pb-1">
                        <span class="text-slate-500">Harga:</span>
                        <span class="font-bold text-blue-600" x-text="formatPrice(selectedItem?.PRICE)"></span>
                    </div>
                    <div class="flex justify-between border-b border-slate-100 pb-1">
                        <span class="text-slate-500">Status:</span>
                        <span class="font-bold uppercase px-1 rounded text-[8px]" :class="selectedItem?.STATUS === 'AVAILABLE' ? 'bg-emerald-100 text-emerald-700' : (selectedItem?.STATUS === 'BOOKED' ? 'bg-amber-100 text-amber-700' : 'bg-rose-100 text-rose-700')" x-text="selectedItem?.STATUS || '-'"></span>
                    </div>
                    
                    <div>
                        <span class="text-slate-500 block mb-0.5">Nota / Remark:</span>
                        <div class="p-2 bg-amber-50 border border-amber-100 rounded text-amber-900 leading-relaxed break-words max-h-24 overflow-y-auto whitespace-pre-line" x-text="selectedItem?.REMARK || 'Tiada nota.'"></div>
                    </div>

                    <template x-if="selectedItem?.URL">
                        <div>
                            <a :href="selectedItem.URL" target="_blank" class="block text-center w-full py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-600 rounded font-semibold transition">🔗 Buka Pautan Luar</a>
                        </div>
                    </template>
                </div>

                <div class="pt-1 border-t border-slate-100">
                    <button @click="closeDetail()" class="w-full py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded font-semibold transition">Tutup</button>
                </div>

            </div>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCIB8qLZWjGVitHnJzS58BHPYoYdD_i7uM",
            authDomain: "listing-2a59c.firebaseapp.com",
            databaseURL: "https://jacksonlisting-5b878-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "listing-2a59c",
            storageBucket: "listing-2a59c.firebasestorage.app",
            messagingSenderId: "363739620416",
            appId: "1:363739620416:web:b14bd9043ac09a8032eba5",
            measurementId: "G-SZ47HNR9PT"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function publicPropertyApp() {
            return {
                search: '',
                statusFilter: '',
                zoneFilter: '',
                forFilter: '',
                typeFilter: '',
                ownerFilter: '',
                sortBy: 'latest',
                properties: {},
                selectedItem: null,
                currentPage: 1,
                itemsPerPage: 13, // Tetapan tetap 13 listing setiap halaman

                init() {
                    const cachedData = localStorage.getItem('jackson_properties');
                    if (cachedData) {
                        this.properties = JSON.parse(cachedData);
                    }

                    db.ref('properties').on('value', snapshot => {
                        const data = snapshot.val() || {};
                        this.properties = data;
                        localStorage.setItem('jackson_properties', JSON.stringify(data));
                        if (this.selectedItem && data[this.selectedItem.id]) {
                            this.selectedItem = { id: this.selectedItem.id, ...data[this.selectedItem.id] };
                        }
                    });

                    this.$watch('search', () => this.currentPage = 1);
                    this.$watch('statusFilter', () => this.currentPage = 1);
                    this.$watch('zoneFilter', () => this.currentPage = 1);
                    this.$watch('forFilter', () => this.currentPage = 1);
                    this.$watch('typeFilter', () => this.currentPage = 1);
                    this.$watch('ownerFilter', () => this.currentPage = 1);
                    this.$watch('sortBy', () => this.currentPage = 1);
                },
                formatPrice(val) {
                    if (!val) return 'RM 0';
                    let cleanNum = String(val).replace(/[^0-9.]/g, '');
                    let num = parseFloat(cleanNum);
                    if (isNaN(num)) return val;
                    return 'RM ' + num.toLocaleString('en-US', {maximumFractionDigits: 2});
                },
                get uniqueOwners() {
                    let owners = Object.values(this.properties).map(item => item.OWNER).filter(Boolean);
                    return [...new Set(owners)].sort();
                },
                get getFilteredResult() {
                    let entries = Object.entries(this.properties);
                    return entries.filter(([id, item]) => {
                        const matchSearch = ((item.PROPERTY || '') + (item.OWNER || '') + (item.ZONE || '') + (item.REMARK || '')).toLowerCase().includes(this.search.toLowerCase());
                        const matchStatus = this.statusFilter === '' || item.STATUS === this.statusFilter;
                        const matchZone = this.zoneFilter === '' || item.ZONE === this.zoneFilter;
                        const matchFor = this.forFilter === '' || item.FOR === this.forFilter;
                        const matchType = this.typeFilter === '' || item.TYPE === this.typeFilter;
                        const matchOwner = this.ownerFilter === '' || item.OWNER === this.ownerFilter;
                        return matchSearch && matchStatus && matchZone && matchFor && matchType && matchOwner;
                    });
                },
                get totalFilteredCount() {
                    return this.getFilteredResult.length;
                },
                get totalPages() {
                    return Math.ceil(this.totalFilteredCount / this.itemsPerPage) || 1;
                },
                get filteredProperties() {
                    let result = this.getFilteredResult;
                    let mapped = result.map(([id, item]) => ({ id, ...item }));

                    let sorted = mapped.sort((a, b) => {
                        if (this.sortBy === 'latest') {
                            return (b.createdAt || 0) - (a.createdAt || 0);
                        } else if (this.sortBy === 'name_asc') {
                            return (a.PROPERTY || '').localeCompare(b.PROPERTY || '');
                        } else if (this.sortBy === 'price_asc' || this.sortBy === 'price_desc') {
                            let priceA = parseFloat(String(a.PRICE || '0').replace(/[^0-9.]/g, '')) || 0;
                            let priceB = parseFloat(String(b.PRICE || '0').replace(/[^0-9.]/g, '')) || 0;
                            return this.sortBy === 'price_asc' ? priceA - priceB : priceB - priceA;
                        }
                    });

                    let start = (this.currentPage - 1) * this.itemsPerPage;
                    let paginated = sorted.slice(start, start + this.itemsPerPage);

                    return paginated.reduce((acc, curr) => {
                        acc[curr.id] = curr;
                        return acc;
                    }, {});
                },
                showDetail(item) {
                    this.selectedItem = item;
                },
                closeDetail() {
                    this.selectedItem = null;
                },
                updateStatus(id, newStatus) {
                    db.ref('properties/' + id + '/STATUS').set(newStatus).then(() => {
                        if (this.properties[id]) {
                            this.properties[id].STATUS = newStatus;
                        }
                    }).catch(error => {
                        alert('Gagal mengemaskini status: ' + error.message);
                    });
                }
            }
        }
    </script>
</body>
</html>
