<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paparan Listing Hartanah Sabah</title>
    <link rel="icon" type="image/png" href="jack.png">

    <!-- SEKAT DOMAIN & CLONING: Hanya boleh run di host rasmi -->
    <script>
        (function() {
            const allowedHost = "sabahmh.github.io";
            const currentHost = window.location.hostname;
            const isLocal = currentHost === "localhost" || currentHost === "127.0.0.1" || currentHost === "";
            
            if (!isLocal && !currentHost.includes(allowedHost)) {
                document.documentElement.innerHTML = `
                    <body style="background:#0f172a; color:#f8fafc; font-family:sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;">
                        <div style="text-align:center; padding:2rem; background:#1e293b; border-radius:12px; border:1px solid #334155; max-width:400px; box-shadow:0 20px 25px -5px rgb(0 0 0 / 0.5);">
                            <h2 style="color:#f43f5e; margin-top:0; font-size:18px;">⛔ AKSES DISEKAT (UNAUTHORIZED)</h2>
                            <p style="font-size:12px; color:#94a3b8; line-height:1.5;">Aplikasi sistem ini dilesenkan khas dan dilindungi. Anda tidak dibenarkan menyalin atau hoskan fail ini di domain luar.</p>
                        </div>
                    </body>
                `;
                throw new Error("Domain unauthorized.");
            }
        })();
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-2 select-none text-[11px]" oncontextmenu="return false" onkeydown="return disableShortcuts(event)" x-data="publicPropertyApp()">
    
    <!-- 🔐 SKRIN LOGIN (PENGESAHAN ID & KOD LALUAN HASH) -->
    <div x-show="!isLoggedIn" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-3" style="display: none;">
        <div class="bg-white rounded-xl max-w-xs w-full p-4 shadow-2xl border border-slate-100 text-center space-y-3">
            <div class="inline-flex p-2 bg-blue-50 text-blue-600 rounded-full text-lg">🔒</div>
            <div>
                <h2 class="font-bold text-slate-900 text-xs uppercase">Akses Terhad Listing</h2>
                <p class="text-[10px] text-slate-500 mt-0.5">Sila masukkan ID & kata laluan.</p>
            </div>
            <form @submit.prevent="handleLogin" class="space-y-2">
                <input type="text" x-model="loginId" placeholder="ID Pengguna" class="w-full px-2.5 py-1.5 bg-slate-50 border border-slate-200 rounded text-center text-xs focus:outline-none focus:ring-1 focus:ring-blue-500">
                <input type="password" x-model="passcode" placeholder="Kata Laluan" class="w-full px-2.5 py-1.5 bg-slate-50 border border-slate-200 rounded text-center text-xs focus:outline-none focus:ring-1 focus:ring-blue-500">
                <button type="submit" class="w-full py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded font-semibold text-xs transition">Masuk Sistem</button>
            </form>
            <div class="text-[9px] text-rose-500 font-medium" x-show="loginError" x-text="errorMessage"></div>
        </div>
    </div>

    <!-- 🌟 KANDUNGAN UTAMA (Hanya dipaparkan selepas berjaya login) -->
    <div x-show="isLoggedIn" style="display: none;">
        <!-- Header Ringkas & Kompak -->
        <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-2 py-1 shadow-xs">
            <div class="max-w-4xl mx-auto flex justify-between items-center gap-2">
                <div class="flex items-center gap-1.5">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQh4BKiyvgK3c6XwcrQXVOW-9tGNkR583IpNIIBxEZU_6WGty0otjwrwKOn&s=10" alt="Logo" class="w-4 h-4 object-contain rounded-xs">
                    <div>
                        <h1 class="font-bold text-slate-900 leading-none text-xs">🏠 Listing Jackson (Viewer)</h1>
                        <span class="text-[8px] font-semibold text-emerald-600">👀 Mod Paparan & Kemaskini Status</span>
                    </div>
                </div>

                <!-- Bahagian Kanan Header (Keterangan + Butang Keluar) -->
                <div class="flex items-center gap-2 shrink-0">
                    <span class="text-[9px] text-slate-500 font-medium hidden sm:inline">SABAH MABUK HARTANAH</span>
                    <button @click="logout()" class="px-2 py-0.5 bg-rose-50 hover:bg-rose-100 active:scale-95 text-rose-600 border border-rose-200 rounded text-[9px] font-bold transition flex items-center gap-1 cursor-pointer" title="Log Keluar">
                        <span>🚪</span> Log Keluar
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-4xl mx-auto p-1 space-y-1 mt-1">
            <!-- Carian & Filter Mikro (Kompak 2 Row) -->
            <div class="bg-white p-1 rounded shadow-2xs border border-slate-200 space-y-1">
                <!-- Baris 1: Kotak Carian Penuh -->
                <div class="relative">
                    <input type="text" x-model="search" placeholder="🔍 Cari nama, owner, nota..." class="w-full px-2 py-0.5 pr-6 bg-slate-50 border border-slate-200 rounded text-[11px] focus:outline-none focus:ring-1 focus:ring-blue-500">
                    <template x-if="search">
                        <button @click="search = ''" class="absolute right-1.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 font-bold text-xs px-1" title="Padam carian">&times;</button>
                    </template>
                </div>

                <!-- Baris 2: 6 Kotak Select Filter (3x2 pada mobile, 6 sebaris pada desktop) -->
                <div class="grid grid-cols-3 sm:grid-cols-6 gap-0.5">
                    <select x-model="statusFilter" class="px-1 py-0.5 bg-slate-50 border border-slate-200 rounded text-[10px]">
                        <option value="">Status</option>
                        <option value="AVAILABLE">AVAILABLE</option>
                        <option value="BOOKED">BOOKED</option>
                        <option value="SOLD">SOLD</option>
                        <option value="HOLD">HOLD</option>
                    </select>
                    <select x-model="zoneFilter" class="px-1 py-0.5 bg-slate-50 border border-slate-200 rounded text-[10px]">
                        <option value="">Zon</option>
                        <option value="SDK">SDK</option>
                        <option value="KK">KK</option>
                        <option value="TWU">TWU</option>
                        <option value="LDU">LDU</option>
                        <option value="SPA">SPA</option>
                        <option value="RNU">RNU</option>
                    </select>
                    <select x-model="forFilter" class="px-1 py-0.5 bg-slate-50 border border-slate-200 rounded text-[10px]">
                        <option value="">Urusan</option>
                        <option value="SELL">SELL</option>
                        <option value="RENT">RENT</option>
                    </select>
                    <select x-model="typeFilter" class="px-1 py-0.5 bg-slate-50 border border-slate-200 rounded text-[10px]">
                        <option value="">Jenis</option>
                        <option value="APT">APT</option>
                        <option value="LANDED">LANDED</option>
                        <option value="COMMERCIAL">COMMERCIAL</option>
                    </select>
                    <select x-model="lotFilter" class="px-1 py-0.5 bg-slate-50 border border-slate-200 rounded text-[10px]">
                        <option value="">Lot</option>
                        <option value="INTERMEDIATE">INTERMEDIATE</option>
                        <option value="CORNER">CORNER</option>
                        <option value="END LOT">END LOT</option>
                    </select>
                    <select x-model="ownerFilter" class="px-1 py-0.5 bg-slate-50 border border-slate-200 rounded text-[10px]">
                        <option value="">Owner</option>
                        <template x-for="own in uniqueOwners">
                            <option :value="own" x-text="own"></option>
                        </template>
                    </select>
                </div>

                <!-- Baris Tambahan untuk Susunan & Jumlah Rekod -->
                <div class="flex justify-between items-center px-0.5 text-[9px] text-slate-500 border-t border-slate-100 pt-0.5">
                    <span>Jumlah Hasil Tapisan: <strong class="text-slate-700" x-text="totalFilteredCount"></strong> rekod <span x-show="search || statusFilter || zoneFilter || forFilter || typeFilter || lotFilter || ownerFilter" class="text-blue-600 font-medium">*(Ditapis)*</span></span>
                    <select x-model="sortBy" class="bg-slate-50 border border-slate-200 rounded text-[9px] px-1 py-0.5">
                        <option value="latest">Terkini</option>
                        <option value="name_asc">Nama (A-Z)</option>
                        <option value="name_desc">Nama (Z-A)</option>
                        <option value="price_asc">Harga ⬆</option>
                        <option value="price_desc">Harga ⬇</option>
                    </select>
                </div>
            </div>

            <!-- Senarai Listing -->
            <div class="bg-white rounded shadow-2xs border border-slate-200 divide-y divide-slate-100 overflow-hidden">
                <template x-for="(item, id) in filteredProperties" :key="id">
                    <div @click="showDetail(item)" class="px-2 py-1 flex items-center justify-between gap-1 hover:bg-slate-50 transition cursor-pointer">
                        <div class="flex items-center gap-1.5 min-w-0 flex-1">
                            <div class="flex flex-col gap-0.5 shrink-0">
                                <span class="px-1 py-0 text-[7px] font-bold rounded bg-indigo-50 text-indigo-600 uppercase text-center" x-text="item.ZONE"></span>
                                <span class="px-1 py-0 text-[7px] font-medium rounded bg-slate-100 text-slate-600 uppercase text-center" x-text="item.TYPE"></span>
                            </div>
                            <div class="min-w-0 flex-1">
                                <div class="flex items-center gap-1">
                                    <span class="font-bold text-slate-900 truncate text-[11px] uppercase" x-text="item.PROPERTY"></span>
                                    <template x-if="item.LOT">
                                        <span class="px-1 py-0 text-[7px] font-bold rounded bg-purple-50 text-purple-700 uppercase" x-text="item.LOT"></span>
                                    </template>
                                    <span class="text-[8px] font-bold text-slate-400 shrink-0" x-text="'[' + item.FOR + ']'"></span>
                                </div>
                                <div class="flex items-center gap-1 text-[9px] text-slate-500 leading-none">
                                    <span class="truncate">Owner: <strong class="text-slate-700" x-text="item.OWNER || '-'"></strong></span>
                                    <template x-if="item.REMARK">
                                        <span class="text-amber-600 bg-amber-50 px-1 rounded truncate max-w-[120px]" x-text="item.REMARK"></span>
                                    </template>
                                </div>
                            </div>
                        </div>

                        <div class="flex items-center gap-2 shrink-0 text-right">
                            <div>
                                <div class="font-bold text-blue-600 text-[11px] leading-tight" x-text="formatPrice(item.PRICE)"></div>
                                <div class="flex items-center justify-end gap-1 mt-0.5">
                                    <select @click.stop @change="updateStatus(id, $event.target.value)" 
                                        :class="item.STATUS === 'AVAILABLE' ? 'bg-emerald-100 text-emerald-700 border-emerald-300' : (item.STATUS === 'BOOKED' ? 'bg-amber-100 text-amber-700 border-amber-300' : 'bg-rose-100 text-rose-700 border-rose-300')" 
                                        class="px-1 py-0 text-[8px] font-bold rounded uppercase border cursor-pointer outline-none">
                                        <option value="AVAILABLE" :selected="item.STATUS === 'AVAILABLE'">AVAILABLE</option>
                                        <option value="BOOKED" :selected="item.STATUS === 'BOOKED'">BOOKED</option>
                                        <option value="SOLD" :selected="item.STATUS === 'SOLD'">SOLD</option>
                                        <option value="HOLD" :selected="item.STATUS === 'HOLD'">HOLD</option>
                                    </select>
                                </div>
                            </div>

                            <div class="flex items-center gap-1 border-l border-slate-100 pl-1.5">
                                <template x-if="item.URL">
                                    <a :href="item.URL" target="_blank" class="text-blue-600 hover:text-blue-800 text-xs p-0.5" title="Pautan" @click.stop>🔗</a>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>
                <template x-if="Object.keys(filteredProperties).length === 0">
                    <div class="p-4 text-center text-slate-400 text-xs">
                        Tiada rekod hartanah ditemui.
                    </div>
                </template>
            </div>

            <!-- 📄 NAVIGASI PAGINATION -->
            <div class="flex justify-between items-center bg-white px-2 py-1 rounded shadow-2xs border border-slate-200 text-[10px]" x-show="totalPages > 1">
                <button @click="currentPage > 1 ? currentPage-- : null" :class="currentPage === 1 ? 'opacity-40 cursor-not-allowed' : 'hover:bg-slate-100'" class="px-2 py-0.5 border rounded bg-slate-50 font-semibold text-slate-700">
                    ⬅ Sebelumnya
                </button>
                
                <span class="text-slate-600 font-medium">
                    Halaman <strong class="text-slate-900" x-text="currentPage"></strong> dari <strong class="text-slate-900" x-text="totalPages"></strong>
                </span>

                <button @click="currentPage < totalPages ? currentPage++ : null" :class="currentPage === totalPages ? 'opacity-40 cursor-not-allowed' : 'hover:bg-slate-100'" class="px-2 py-0.5 border rounded bg-slate-50 font-semibold text-slate-700">
                    Seterusnya ➡
                </button>
            </div>

            <!-- MODAL DETAIL / NOTA -->
            <div x-show="selectedItem" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-3 z-50" style="display: none;" @click.self="closeDetail()">
                <div class="bg-white rounded-xl max-w-sm w-full p-3 shadow-2xl border border-slate-100 space-y-2.5 max-h-[85vh] flex flex-col">
                    
                    <!-- Header Modal -->
                    <div class="flex justify-between items-start border-b pb-1.5 gap-2">
                        <h3 class="font-bold text-slate-900 text-xs uppercase leading-snug break-words" x-text="selectedItem?.PROPERTY"></h3>
                        <button @click="closeDetail()" class="text-slate-400 hover:text-slate-600 font-bold text-base p-1 -mr-1 -mt-1 leading-none">&times;</button>
                    </div>

                    <!-- Kandungan Utama -->
                    <div class="space-y-1 text-[11px] text-slate-700 overflow-y-auto pr-1">
                        <div class="flex justify-between items-center border-b border-slate-100 pb-1">
                            <span class="text-slate-500 font-medium">Urusan / Jenis:</span>
                            <span class="font-bold uppercase" x-text="(selectedItem?.FOR || '-') + ' / ' + (selectedItem?.TYPE || '-')"></span>
                        </div>
                        <div class="flex justify-between items-center border-b border-slate-100 pb-1">
                            <span class="text-slate-500 font-medium">Lot:</span>
                            <span class="font-bold uppercase" x-text="selectedItem?.LOT || 'INTERMEDIATE'"></span>
                        </div>
                        <div class="flex justify-between items-center border-b border-slate-100 pb-1">
                            <span class="text-slate-500 font-medium">Zon:</span>
                            <span class="font-bold uppercase" x-text="selectedItem?.ZONE || '-'"></span>
                        </div>
                        <div class="flex justify-between items-center border-b border-slate-100 pb-1">
                            <span class="text-slate-500 font-medium">Owner / Agen:</span>
                            <span class="font-bold uppercase" x-text="selectedItem?.OWNER || '-'"></span>
                        </div>
                        <div class="flex justify-between items-center border-b border-slate-100 pb-1">
                            <span class="text-slate-500 font-medium">Harga:</span>
                            <span class="font-bold text-blue-600 text-xs" x-text="formatPrice(selectedItem?.PRICE)"></span>
                        </div>
                        <div class="flex justify-between items-center border-b border-slate-100 pb-1">
                            <span class="text-slate-500 font-medium">Status Semasa:</span>
                            <span class="font-bold uppercase px-1.5 py-0.5 rounded text-[9px]" :class="selectedItem?.STATUS === 'AVAILABLE' ? 'bg-emerald-100 text-emerald-700' : (selectedItem?.STATUS === 'BOOKED' ? 'bg-amber-100 text-amber-700' : 'bg-rose-100 text-rose-700')" x-text="selectedItem?.STATUS || '-'"></span>
                        </div>
                        
                        <div class="pt-0.5">
                            <span class="text-slate-500 font-medium block mb-0.5">Nota / Remark:</span>
                            <div class="p-2 bg-amber-50 border border-amber-100 rounded-lg text-amber-900 text-[11px] leading-relaxed break-words max-h-32 overflow-y-auto whitespace-pre-line" x-text="selectedItem?.REMARK || 'Tiada nota dimasukkan.'"></div>
                        </div>

                        <template x-if="selectedItem?.URL">
                            <div class="pt-0.5">
                                <a :href="selectedItem.URL" target="_blank" class="block text-center w-full py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-600 rounded-lg font-semibold text-[11px] transition">🔗 Buka Pautan Luar</a>
                            </div>
                        </template>
                    </div>

                    <!-- Butang Tutup Bawah -->
                    <div class="pt-1 border-t border-slate-100">
                        <button @click="closeDetail()" class="w-full py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold transition">Tutup</button>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCIB8qLZWjGVitHnJzS58BHPYoYdD_i7uM",
            authDomain: "listing-2a59c.firebaseapp.com",
            databaseURL: "https://jacksonlisting-5b878-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "listing-2a59c",
            storageBucket: "listing-2a59c.firebasestorage.app",
            messagingSenderId: "363739620416",
            appId: "1:363739620416:web:b14bd9043ac09a8032eba5",
            measurementId: "G-SZ47HNR9PT"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function disableShortcuts(e) {
            if (e.key === 'F12') return false;
            if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C', 'i', 'j', 'c'].includes(e.key)) return false;
            if (e.ctrlKey && ['u', 's', 'U', 'S', 'e', 'E'].includes(e.key)) return false;
            return true;
        }

        function publicPropertyApp() {
            return {
                // State Login & Keselamatan
                isLoggedIn: sessionStorage.getItem('jackson_auth') === 'true',
                loginId: '',
                passcode: '',
                loginError: false,
                errorMessage: '',

                // ID sah & Hash SHA-256 bagi "maxxan123"
                VALID_ID: "maxxan",
                SECRET_HASH: "22a6b05689c9cb5d2b446b99ab4fc555a4a3f267d74bb6e7bb3a01144dcb3907",

                async sha256(str) {
                    const buffer = new TextEncoder().encode(str);
                    const digest = await crypto.subtle.digest('SHA-256', buffer);
                    return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
                },

                async handleLogin() {
                    if (!this.loginId || !this.passcode) {
                        this.loginError = true;
                        this.errorMessage = 'Sila masukkan ID dan kata laluan!';
                        return;
                    }

                    if (this.loginId.trim() !== this.VALID_ID) {
                        this.loginError = true;
                        this.errorMessage = 'ID Pengguna tidak sah!';
                        this.passcode = '';
                        return;
                    }

                    const inputHash = await this.sha256(this.passcode);
                    
                    if (inputHash === this.SECRET_HASH) {
                        sessionStorage.setItem('jackson_auth', 'true');
                        this.isLoggedIn = true;
                        this.loginError = false;
                        this.passcode = '';
                    } else {
                        this.loginError = true;
                        this.errorMessage = 'Kata laluan tidak sah!';
                        this.passcode = '';
                    }
                },

                logout() {
                    sessionStorage.removeItem('jackson_auth');
                    this.isLoggedIn = false;
                    this.loginId = '';
                    this.passcode = '';
                },

                search: '',
                statusFilter: '',
                zoneFilter: '',
                forFilter: '',
                typeFilter: '',
                lotFilter: '',
                ownerFilter: '',
                sortBy: 'latest',
                properties: {},
                selectedItem: null,
                currentPage: 1,
                itemsPerPage: 15,

                init() {
                    const cachedData = localStorage.getItem('jackson_properties');
                    if (cachedData) {
                        this.properties = JSON.parse(cachedData);
                    }

                    db.ref('properties').on('value', snapshot => {
                        const data = snapshot.val() || {};
                        this.properties = data;
                        localStorage.setItem('jackson_properties', JSON.stringify(data));
                        if (this.selectedItem && data[this.selectedItem.id]) {
                            this.selectedItem = { id: this.selectedItem.id, ...data[this.selectedItem.id] };
                        }
                    });

                    this.$watch('search', () => this.currentPage = 1);
                    this.$watch('statusFilter', () => this.currentPage = 1);
                    this.$watch('zoneFilter', () => this.currentPage = 1);
                    this.$watch('forFilter', () => this.currentPage = 1);
                    this.$watch('typeFilter', () => this.currentPage = 1);
                    this.$watch('lotFilter', () => this.currentPage = 1);
                    this.$watch('ownerFilter', () => this.currentPage = 1);
                    this.$watch('sortBy', () => this.currentPage = 1);
                },
                formatPrice(val) {
                    if (!val) return 'RM 0';
                    let cleanNum = String(val).replace(/[^0-9.]/g, '');
                    let num = parseFloat(cleanNum);
                    if (isNaN(num)) return val;
                    return 'RM ' + num.toLocaleString('en-US', {maximumFractionDigits: 2});
                },
                get uniqueOwners() {
                    let owners = Object.values(this.properties).map(item => item.OWNER).filter(Boolean);
                    return [...new Set(owners)].sort();
                },
                get getFilteredResult() {
                    let entries = Object.entries(this.properties);
                    return entries.filter(([id, item]) => {
                        const matchSearch = ((item.PROPERTY || '') + (item.OWNER || '') + (item.ZONE || '') + (item.REMARK || '')).toLowerCase().includes(this.search.toLowerCase());
                        const matchStatus = this.statusFilter === '' || item.STATUS === this.statusFilter;
                        const matchZone = this.zoneFilter === '' || item.ZONE === this.zoneFilter;
                        const matchFor = this.forFilter === '' || item.FOR === this.forFilter;
                        const matchType = this.typeFilter === '' || item.TYPE === this.typeFilter;
                        const matchLot = this.lotFilter === '' || (item.LOT || 'INTERMEDIATE') === this.lotFilter;
                        const matchOwner = this.ownerFilter === '' || item.OWNER === this.ownerFilter;
                        return matchSearch && matchStatus && matchZone && matchFor && matchType && matchLot && matchOwner;
                    });
                },
                get totalFilteredCount() {
                    return this.getFilteredResult.length;
                },
                get totalPages() {
                    return Math.ceil(this.totalFilteredCount / this.itemsPerPage) || 1;
                },
                get filteredProperties() {
                    let result = this.getFilteredResult;
                    let mapped = result.map(([id, item]) => ({ id, ...item }));

                    let sorted = mapped.sort((a, b) => {
                        if (this.sortBy === 'latest') {
                            return (b.createdAt || 0) - (a.createdAt || 0);
                        } else if (this.sortBy === 'name_asc') {
                            return (a.PROPERTY || '').localeCompare(b.PROPERTY || '');
                        } else if (this.sortBy === 'name_desc') {
                            return (b.PROPERTY || '').localeCompare(a.PROPERTY || '');
                        } else if (this.sortBy === 'price_asc' || this.sortBy === 'price_desc') {
                            let priceA = parseFloat(String(a.PRICE || '0').replace(/[^0-9.]/g, '')) || 0;
                            let priceB = parseFloat(String(b.PRICE || '0').replace(/[^0-9.]/g, '')) || 0;
                            return this.sortBy === 'price_asc' ? priceA - priceB : priceB - priceA;
                        }
                    });

                    let start = (this.currentPage - 1) * this.itemsPerPage;
                    let paginated = sorted.slice(start, start + this.itemsPerPage);

                    return paginated.reduce((acc, curr) => {
                        acc[curr.id] = curr;
                        return acc;
                    }, {});
                },
                showDetail(item) {
                    this.selectedItem = item;
                },
                closeDetail() {
                    this.selectedItem = null;
                },
                updateStatus(id, newStatus) {
                    db.ref('properties/' + id + '/STATUS').set(newStatus).then(() => {
                        if (this.properties[id]) {
                            this.properties[id].STATUS = newStatus;
                        }
                    }).catch(error => {
                        alert('Gagal mengemaskini status: ' + error.message);
                    });
                }
            }
        }
    </script>
</body>
</html>
